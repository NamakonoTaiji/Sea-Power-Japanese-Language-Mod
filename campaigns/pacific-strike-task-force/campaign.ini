Name_en=VENGEANCE AT LUZON
MissionSequenceName_en=MISSION 10
MapShortName_en=10
Description_en=West of Luzon, Philippines
MissionImage_en=campaigns/pacific-strike-task-force/art/pacific_strike_10_sheet.png
MissionIntro_en=Enemy forces have deployed the carrier Kiev to cover a reinforcement convoy bound for Palawan. Our troops ashore are already locked in heavy fighting, and fresh enemy forces could decide the battle. Proceed west from Mindoro, locate the Kiev, and destroy the carrier and convoy before they can reach Palawan.
#MissionResupplyRules_en=After this mission, your Task Force will be fully rearmed, with repair facilities and reinforcements available.

Name_cn=吕宋岛的复仇
MissionSequenceName_cn=任务10
MapShortName_cn=10
Description_cn=菲律宾，吕宋岛以西
MissionImage_cn=campaigns/pacific-strike-task-force/art/pacific_strike_10_sheet.png
MissionIntro_cn=敌方已派出基辅号航母掩护前往巴拉望岛的增援护航队。我方岸上部队已陷入苦战，敌方的增援部队可能将成为胜负手。从民都洛岛向西航行，找到基辅号，在敌方航母和护航队抵达巴拉望岛之前将其摧毁。
#MissionResupplyRules_cn=完成此任务后，你的特遣舰队将补充满弹药，也可以使用维修设施并获得增援。

Name_ru=Возмездие в Лусоне
MissionSequenceName_ru=МИССИЯ 10
MapShortName_ru=10
Description_ru=Западнее Лусона, Филиппины
MissionIntro_ru=Наши войска на острове Палаван ведут тяжёлые бои. Противник оказывает ожесточённое сопротивление и исход битвы пока неясен. Для поддержки своих сил на острове, противник отправил конвой с мощным эскортом в состав которого входит авианесущий крейсер «Киев». Выдвигайтесь к западу от Миндоро, обнаружьте «Киев» и уничтожьте его и конвой, прежде чем они смогут достичь Палавана.
MissionResupplyRules_ru=Ваша группа действует в зоне базы снабжения. После миссии вам будет доступен ремонт и планировщик группы. Боекомплект будет автоматически восполнен.

Name_de=VERGELTUNG BEI LUZON
MissionSequenceName_de=MISSION 10
MapShortName_de=10
Description_de=Westlich von Luzon, Philippinen
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_10_sheet.png
MissionIntro_de=Feindliche Kräfte haben den Träger Kiev eingesetzt, um einen Verstärkungskonvoi nach Palawan zu decken. Unsere Truppen an Land sind bereits in schwere Kämpfe verwickelt und frische feindliche Kräfte könnten die Schlacht entscheiden. Verlegen Sie von Mindoro nach Westen, spüren Sie die Kiev auf und zerstören Sie den Träger sowie den Konvoi, bevor sie Palawan erreichen können.
MissionResupplyRules_de=Nach dieser Mission wird Ihre Task Force vollständig aufmunitioniert. Reparatureinrichtungen und Verstärkungen stehen zur Verfügung.

Name_ja=ルソン沖の報復
MissionSequenceName_ja=ミッション 10
MapShortName_ja=10
Description_ja=フィリピン、ルソン島西方
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_10_sheet.png
MissionIntro_ja=敵はパラワン島へ向かう増援船団を護衛するため、空母キエフを展開させた。上陸した我が軍はすでに激戦を繰り広げており、敵の増援によって戦況が決しかねない。ミンドロ島から西進してキエフを発見し、空母と船団がパラワン島に到達する前に撃滅せよ。

