Name_en=SUNDA STRAIT
MissionSequenceName_en=MISSION 4
MapShortName_en=04
Description_en=Jakarta, Indonesia
MissionImage_en=campaigns/pacific-strike-task-force/art/pacific_strike_04_sheet.png
MissionIntro_en=Singapore and Indonesia have been heavily suppressed by enemy air and naval attacks, and US forces in the area have been ordered to retreat and reconsolidate. Run the Sunda Strait with your Task Force to reach open ocean to live to fight another day.
MissionResupplyRules_en=After this mission, your Task Force will be fully rearmed, with repair facilities and reinforcements available.
TaskForceModeDebriefNoticeTitle_en=Airwing Operations Unlocked
TaskForceModeDebriefNoticeText_en=Fixed-wing aircraft can now be added to your airwing. They will deploy from land-based airbases in supported missions, and can be added from Task Force Builder.
TaskForceModeBuilderSituation_en=We are operating away from major Allied bases and reinforcements are limited to the few ships currently in the area. More units will be available after reaching Australia.

Name_cn=巽他海峡
MissionSequenceName_cn=任务4
MapShortName_cn=04
Description_cn=印度尼西亚，雅加达
MissionImage_cn=campaigns/pacific-strike-task-force/art/pacific_strike_04_sheet.png
MissionIntro_cn=新加坡和印度尼西亚遭到了敌方猛烈海空攻击的压制，此区域内的美军已收到命令撤退并重新集结。率领你的特遣舰队穿越巽他海峡，抵达公海，保存实力以图来日再战。
MissionResupplyRules_cn=完成此任务后，你的特遣舰队将补充满弹药，也可以使用维修设施并获得增援。
TaskForceModeDebriefNoticeTitle_cn=已解锁航空联队
TaskForceModeDebriefNoticeText_cn=固定翼飞机现在可以加入你的航空联队。它们将在支持的任务中从陆基航空基地部署，并且可以通过特遣舰队组建器添加。
TaskForceModeBuilderSituation_cn=我们正在远离盟军主要基地的位置行动，增援力量仅限于此区域内的几艘船只。抵达澳大利亚后将有更多单位可用。

Name_ru=Зондский пролив
MissionSequenceName_ru=МИССИЯ 4
MapShortName_ru=04
Description_ru=Джакарта, Индонезия
MissionIntro_ru=Сингапур и Индонезия подверглись массированным атакам противника с воздуха и моря, и американским войскам в этом районе было приказано отступить и перегруппироваться. Пройдите Зондский пролив, чтобы выйти в открытый океан и получить шанс продолжить сражаться дальше.
TaskForceModeDebriefNoticeTitle_ru=Разблокирокирована базовая авиация
TaskForceModeDebriefNoticeText_ru=Самолеты теперь могут быть добавлены в состав вашей группы. Они будут развернуты с наземных авиабаз (если такие присутствуют в миссиях) и могут быть добавлены в Планировщике группы.
MissionResupplyRules_ru=Ваша группа действует в зоне базы снабжения. После миссии вам будет доступен ремонт и планировщик группы. Боекомплект будет автоматически восполнен.

Name_de=SUNDASTRASSE
MissionSequenceName_de=MISSION 4
MapShortName_de=04
Description_de=Jakarta, Indonesien
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_04_sheet.png
MissionIntro_de=Singapur und Indonesien wurden durch feindliche Luft- und Seeangriffe schwer unter Druck gesetzt. Die US-Streitkräfte im Einsatzraum haben den Befehl erhalten, sich zurückzuziehen und neu zu formieren. Durchqueren Sie mit Ihrer Task Force die Sundastraße und erreichen Sie die offene See, um den Kampf ein anderes Mal fortzuführen.
TaskForceModeDebriefNoticeTitle_de=Flugplatzoperationen freigeschaltet
TaskForceModeDebriefNoticeText_de=Landgestützte Luftfahrzeuge können nun von Missionsflugplätzen aus eingesetzt werden. Kaufen Sie Luftfahrzeuge im Task-Force-Builder und überprüfen Sie vor dem Start ihre Zuweisung im Task-Force-Manager.

Name_ja=スンダ海峡
MissionSequenceName_ja=ミッション 4
MapShortName_ja=04
Description_ja=インドネシア、ジャカルタ
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_04_sheet.png
MissionIntro_ja=シンガポールとインドネシアは敵の空海軍による激しい攻撃を受け、当海域の米軍には後退・再編命令が下った。任務部隊を率いてスンダ海峡を突破し、再起を期して外洋への脱出を図れ。
MissionResupplyRules_ja=本ミッションの終了後、任務部隊の弾薬は全量補充され、修理施設と増援も利用できる。
TaskForceModeDebriefNoticeTitle_ja=航空団の運用が解禁
TaskForceModeDebriefNoticeText_ja=航空団に固定翼機を追加できるようになった。対応するミッションでは陸上航空基地から展開する。任務部隊ビルダーから追加できる。
TaskForceModeBuilderSituation_ja=同盟軍の主要基地から離れて行動中であり、増援は現在この海域にいる数隻の艦艇に限られる。オーストラリア到着後は、さらに多くの艦艇を利用できる。

