Name_en=RAID ON LOMBOK
MissionSequenceName_en=MISSION 6
MapShortName_en=06
Description_en=Lombok Strait, Bali, Indonesia
MissionIntro_en=The Allied counteroffensive in the Pacific is underway. Your Task Force has been ordered to force the Lombok Strait and destroy all enemy forces operating in the area. Success will relieve pressure on Indonesia and open the way for further operations to the north.
MissionResupplyRules_en=Your Task Force will be operating away from resupply, reinforcements, and repair facilities during this mission. Expend weapons wisely.

Name_cn=突袭龙目海峡
MissionSequenceName_cn=任务6
MapShortName_cn=06
Description_cn=印度尼西亚，巴厘岛，龙目海峡
MissionIntro_cn=盟军已在太平洋开始反攻。你的特遣舰队收到命令清理龙目海峡，消灭在此区域内活动的所有敌军。此次行动的成功将缓解印度尼西亚的压力并为向北推进的后续行动铺平道路。
MissionResupplyRules_cn=此任务期间，你的特遣舰队将在远离补给、增援和维修设施的位置行动。请明智地使用武器。

Name_ru=Рейд на Ломбок
MissionSequenceName_ru=МИССИЯ 6
MapShortName_ru=06
Description_ru=Ломбокский пролив, Бали, Индонезия
MissionIntro_ru=Контрнаступление союзников в Тихом океане продолжается. Вашему соединению приказано войти в Ломбокский пролив и уничтожить все силы противника, действующие в этом районе. Успех этой операции снимет давление на Индонезия и откроет путь для дальнейшего продвижения на север.
MissionResupplyRules_ru=Ваша оперативная группа действует в отрыве от баз снабжения. Ремонт и пополнение боекомплекта недоступны. Используйте ваши ресурсы осмотрительно.

Name_de=ANGRIFF AUF LOMBOK
MissionSequenceName_de=MISSION 6
MapShortName_de=06
Description_de=Lombokstraße, Bali, Indonesien
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_06_sheet.png
MissionIntro_de=Die alliierte Gegenoffensive im Pazifik hat begonnen. Ihre Task Force hat den Befehl erhalten, die Lombokstraße zu durchbrechen und alle im Einsatzraum operierenden feindlichen Kräfte zu zerstören. Ein Erfolg wird den Druck auf Indonesien verringern und den Weg für weitere Operationen nach Norden öffnen.

Name_ja=ロンボク強襲
MissionSequenceName_ja=ミッション 6
MapShortName_ja=06
Description_ja=インドネシア、バリ島、ロンボク海峡
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_06_sheet.png
MissionIntro_ja=太平洋における同盟軍の反攻作戦が開始された。貴任務部隊はロンボク海峡を強行突破し、同海域で活動するすべての敵戦力を撃滅せよとの命令を受けた。作戦が成功すれば、インドネシアへの圧力が緩和され、さらなる北方での攻勢作戦への道が開かれることになる。
MissionResupplyRules_ja=本ミッション中、任務部隊は補給、増援、および修理施設から離れて作戦行動を行うことになる。弾薬を計画的に使え。

