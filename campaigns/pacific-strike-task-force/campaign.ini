Name_en=RUNNING THE PALAWAN PASSAGE
MissionSequenceName_en=MISSION 3
MapShortName_en=03
Description_en=West of Palawan, Philippine Islands
MissionImage_en=campaigns/pacific-strike-task-force/art/pacific_strike_03_sheet.png
MissionIntro_en=Detached from Okinawa, your task force must head south to join the defense of Singapore. Run the Palawan Passage to reach Sandakan and join the Allied reinforcement group forming there. Heavy submarine opposition is expected.
MissionResupplyRules_en=Task Force will be operating away from resupply and repair facilities during this mission. Expend weapons wisely.
TaskForceModeBuilderSituation_en=We are leaving the Okinawa area for Southeast Asia, and reinforcements in the next few missions will be limited.

Name_cn=通过巴拉望航道
MissionSequenceName_cn=任务3
MapShortName_cn=03
Description_cn=菲律宾群岛，巴拉望岛以西
MissionImage_cn=campaigns/pacific-strike-task-force/art/pacific_strike_03_sheet.png
MissionIntro_cn=你的特遣舰队已离开冲绳，必须向南航行，加入新加坡的防御。通过巴拉望航道前往山打根，加入在那里组建的盟军增援部队。预计敌方将出动大量潜艇拦截。
MissionResupplyRules_cn=此任务期间，你的特遣舰队将在远离补给和维修设施的位置行动。请明智地使用武器。
TaskForceModeBuilderSituation_cn=我们即将离开冲绳海域并前往东南亚，接下来的几次任务中增援力量有限。

Name_ru=Палаванский пролив
MissionSequenceName_ru=МИССИЯ 3
MapShortName_ru=03
Description_ru=К западу от Палавана, Филиппинские острова
MissionIntro_ru=Ваша оперативная группа выводится с Окинавы и должна отправиться на юг, чтобы присоединиться к обороне Сингапура. Пройдите по Палаванскому проливу, чтобы достигнуть Сандакана и присоединиться к формирующейся там группе подкрепления. Ожидайте засады вражеских подводных лодок.
MissionResupplyRules_ru=Ваша оперативная группа действует в отрыве от баз снабжения. Ремонт и пополнение боекомплекта недоступны. Используйте ваши ресурсы осмотрительно.

Name_de=DURCHFAHRT DURCH DIE PALAWAN-PASSAGE
MissionSequenceName_de=MISSION 3
MapShortName_de=03
Description_de=Westlich von Palawan, Philippinische Inseln
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_03_sheet.png
MissionIntro_de=Ihre Task Force muss von Okinawa nach Süden verlegen, um sich der Verteidigung Singapurs anzuschließen. Durchqueren Sie die Palawan-Passage, erreichen Sie Sandakan und schließen Sie sich dort den alliierten Verbänden an. Es ist mit starkem Widerstand durch U-Boote zu rechnen. Hinweis: Aufgrund der kurzfristigen Durchführung dieser Operation stehen in Sandakan keine Kapazitäten für eventuelle Reparaturen oder eine Wiederbewaffnung zur Verfügung. Setzen Sie Ihre Munition mit Bedacht ein.

Name_ja=パラワン海峡突破
MissionSequenceName_ja=ミッション 3
MapShortName_ja=03
Description_ja=フィリピン諸島、パラワン島西方
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_03_sheet.png
MissionIntro_ja=沖縄の配備を解かれた任務部隊は、シンガポール防衛に加わるため南下しなければならない。パラワン海峡を強行突破してサンダカンへと到達し、同地で編成中の同盟軍増援部隊に合流せよ。敵潜水艦による激しい抵抗が予想される。
MissionResupplyRules_ja=本ミッション中、任務部隊は補給および修理施設から離れて作戦行動を行うことになる。弾薬を計画的に使え。
TaskForceModeBuilderSituation_ja=沖縄周辺を離れ、東南アジアへ向かう。今後数回の任務では増援が限られる。

