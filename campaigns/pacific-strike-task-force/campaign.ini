Name_en=DEFENSE OF NORTH BORNEO
MissionSequenceName_en=MISSION 8
MapShortName_en=08
Description_en=Sandakan, Malaysia
MissionImage_en=campaigns/pacific-strike-task-force/art/pacific_strike_08_sheet.png
MissionIntro_en=With Indonesia secured, Allied planning in the Pacific has shifted north towards the Philippines. Sandakan in north Borneo is operating as a forward staging base for the eventual assault on Palawan. Enemy forces are now attempting a spoiling raid against Sandakan to destroy the Allied forces staging there. Take charge of the Allied units in the area to repel the enemy attack.
MissionResupplyRules_en=After this mission, your Task Force will be fully rearmed, with repair facilities and reinforcements available.
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_en=Note: a maximum of three Task Force units may deploy for this mission. Select them on mission start, and other units will be held in reserve elsewhere.

Name_cn=北婆罗洲防御战
MissionSequenceName_cn=任务8
MapShortName_cn=08
Description_cn=马来西亚，山打根
MissionImage_cn=campaigns/pacific-strike-task-force/art/pacific_strike_08_sheet.png
MissionIntro_cn=印度尼西亚的局势稳定之后，盟军在太平洋的战略重心已北移至菲律宾。位于北婆罗洲的山打根正作为前沿基地，盟军在此准备对巴拉望岛的最终攻势。敌军正在尝试对山打根发动破坏性突袭，消灭驻扎在当地的盟军部队。指挥此区域内的盟军单位击退敌方进攻。
MissionResupplyRules_cn=完成此任务后，你的特遣舰队将补充满弹药，也可以使用维修设施并获得增援。
MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_cn=注意：此任务中最多可部署3个特遣舰队单位。请在任务开始时选择部署的单位，剩余单位将作为预备队部署在其他位置。

Name_ru=Оборона Северного Борнео
MissionSequenceName_ru=МИССИЯ 8
MapShortName_ru=08
Description_ru=Сандакан, Малайзия
MissionIntro_ru=С обеспечением безопасности Индонезии, внимание союзников сместилось на север в сторону Филиппин. Сандакан на севере Борнео является хорошим плацдармом для возможного наступления на Палаван. Пытаясь парировать эту угрозу, противник предпринимает наступление на Сандакан. Примите командование войсками союзников в районе Сандакана и отразите атаку противника.
MissionResupplyRules_ru=Ваша группа действует в зоне базы снабжения. После миссии вам будет доступен ремонт и планировщик группы. Боекомплект будет автоматически восполнен.
MissionSpecialNote_ru=Примечание: в этой миссии может быть развернуто не более трех боевых единиц из вашей оперативной группы. Другие подразделения будут находиться в резерве и не примут участия в этой миссии.

Name_de=VERTEIDIGUNG NORDBORNEOS
MissionSequenceName_de=MISSION 8
MapShortName_de=08
Description_de=Sandakan, Malaysia
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_08_sheet.png
MissionIntro_de=Nachdem Indonesien gesichert ist, richtet sich der Fokus der alliierten Operationsplanung im Pazifik nach Norden in Richtung der Philippinen. Sandakan in Nordborneo dient als vorgeschobener Bereitstellungsraum für den späteren Angriff auf Palawan. Feindkräfte versuchen nun einen Störangriff gegen Sandakan durchzuführen, um die dort bereitstehenden alliierten Kräfte zu vernichten. Übernehmen Sie das Kommando über die alliierten Einheiten im Einsatzraum und schlagen Sie den feindlichen Angriff zurück.
MissionSpecialNote_de=Hinweis: In dieser Mission können maximal drei Einheiten der Task Force eingesetzt werden. Wählen Sie diese zu Missionsbeginn aus. Alle übrigen Einheiten verbleiben anderenorts in Reserve.

Name_ja=北ボルネオ防衛
MissionSequenceName_ja=ミッション 8
MapShortName_ja=08
Description_ja=マレーシア、サンダカン
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_08_sheet.png
MissionIntro_ja=インドネシアの安全が確保され、太平洋における同盟軍の作戦計画はフィリピン方面へと移った。ボルネオ島北部のサンダカンは、今後のパラワン島強襲に向けた前進拠点となっている。敵はそこに集結する同盟軍戦力を破壊し、攻勢を妨げるため、サンダカンへの急襲を企てている。周辺の同盟軍部隊を指揮し、敵の攻撃を撃退せよ。
MissionResupplyRules_ja=本ミッションの終了後、任務部隊の弾薬は全量補充され、修理施設と増援も利用できる。
MissionSpecialNote_ja=注記：本ミッションに出撃できる任務部隊のユニットは最大3個である。開始時に出撃ユニットを選択せよ。他のユニットは別の場所で予備に回される。

