Name_en=STRIKE ON THE MONSTER
MissionSequenceName_en=MISSION 5
MapShortName_en=05
Description_en=Off Broome, Australia
MissionImage_en=campaigns/pacific-strike-task-force/art/pacific_strike_05_sheet.png
MissionIntro_en=With Allied forces pushed back to Australia, the enemy is attempting to capitalize on their advantage by sending a heavy raiding force centered on the battlecruiser Kirov into the Indian Ocean. This force was detected transiting Lombok Strait last night, and is likely moving east to threaten Australia. Make use of every Allied naval asset in theater to find and sink the Kirov and her escorts.
MissionWarningPopup_en=DEPLOYMENT ADVISORY|Command recommends dispersing the task force deployment for this operation. Heavy weather will aid concealment, but a compact formation of radar contacts may allow enemy reconnaissance to classify the task force before the coordinated strike. Are you sure you want to proceed?|I have dispersed my task force, start mission|Return to deployment planning
MissionResupplyRules_en=After this mission, your Task Force will be fully rearmed, with repair facilities and reinforcements available.

Name_cn=猎杀巨兽
MissionSequenceName_cn=任务5
MapShortName_cn=05
Description_cn=澳大利亚，布鲁姆沿海
MissionImage_cn=campaigns/pacific-strike-task-force/art/pacific_strike_05_sheet.png
MissionIntro_cn=盟军已被击退至澳大利亚，敌军尝试派遣以基洛夫号战列巡洋舰为核心的强大突袭部队进入印度洋，以此扩大优势。昨夜侦察发现此部队正在通过龙目海峡，目前很可能正在向东移动以威胁澳大利亚。利用战区内的所有盟军海上资产找到并击沉基洛夫号及其护航舰艇。
MissionResupplyRules_cn=完成此任务后，你的特遣舰队将补充满弹药，也可以使用维修设施并获得增援。
MissionWarningPopup_cn=部署建议|指挥部建议在此次行动中分散部署特遣舰队。恶劣的天气有利于隐蔽，但密集的雷达接触可能会导致特遣舰队在发动协同打击前被敌方侦察部队识别。是否确认继续？|我已分散部署特遣舰队，开始任务|返回部署计划

Name_ru=Охота на монстра
MissionSequenceName_ru=МИССИЯ 5
MapShortName_ru=05
Description_ru=Дарвин, Австралия
MissionIntro_ru=После отступления союзных войск к Австралии противник пытается воспользоваться своим преимуществом, отправив в Индийский океан мощную эскадру, центром которой является тяжёлый крейсер «Киров». Это соединение было обнаружено прошлой ночью в Ломбокском проливе и, вероятно, движется на восток, для ведения боевых действий возле Австралии. Используйте все доступные силы союзников, находящиеся на этом театре военных действий, чтобы найти и потопить «Киров» и его эскорт.
MissionResupplyRules_ru=Ваша группа действует в зоне базы снабжения. После миссии вам будет доступен ремонт и планировщик группы. Боекомплект будет автоматически восполнен.

Name_de=ANGRIFF AUF DAS MONSTER
MissionSequenceName_de=MISSION 5
MapShortName_de=05
Description_de=Vor Broome, Australien
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_05_sheet.png
MissionIntro_de=Nachdem die alliierten Kräfte bis nach Australien zurückgedrängt wurden, versucht der Feind, seinen Vorteil auszunutzen, indem er einen schweren Kampfverband um den Schlachtkreuzer Kirov in den Indischen Ozean verlegt. Dieser Verband wurde vergangene Nacht beim Durchqueren der Lombokstraße aufgeklärt und bewegt sich vermutlich nach Osten, um Australien zu bedrohen. Nutzen Sie sämtliche verfügbaren alliierten Marinekräfte im Einsatzraum, um die Kirov und ihre Begleitschiffe aufzuklären und zu vernichten.

Name_ja=巨獣への一撃
MissionSequenceName_ja=ミッション 5
MapShortName_ja=05
Description_ja=オーストラリア、ブルーム沖
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_05_sheet.png
MissionIntro_ja=同盟軍がオーストラリアまで押し戻された今、敵は優勢に乗じて巡洋戦艦キーロフを中核とする強力な襲撃部隊をインド洋へ送り込んだ。同部隊は昨夜ロンボク海峡を通過するところを探知され、オーストラリアを脅かすべく東進しているとみられる。戦域内の同盟軍海軍戦力を総動員し、キーロフとその護衛艦を捜索・撃沈せよ。
MissionResupplyRules_ja=本ミッションの終了後、任務部隊の弾薬は全量補充され、修理施設と増援も利用できる。
MissionWarningPopup_ja=配置に関する勧告|司令部は本作戦に向け、任務部隊を分散配置するよう勧告している。悪天候は隠蔽に役立つが、レーダー反応が密集していると、協同攻撃の前に敵偵察部隊に任務部隊の編成を見抜かれるおそれがある。このまま進むか？|任務部隊を分散配置した。ミッション開始|配置計画に戻る

