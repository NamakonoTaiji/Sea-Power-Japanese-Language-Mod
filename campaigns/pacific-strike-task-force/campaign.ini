Name_en=SHADOWS OFF PALAWAN
MissionSequenceName_en=MISSION 9
MapShortName_en=09
Description_en=Puerto Princesa City, Philippines
MissionImage_en=campaigns/pacific-strike-task-force/art/pacific_strike_09_sheet.png
MissionIntro_en=After repulsing the enemy attack against Sandakan, the Allies have mobilized for an amphibious assault against Palawan. Conduct an anti-surface sweep of the area, then land 17 MAU at Puerto Princesa.
MissionResupplyRules_en=Your Task Force will be operating away from resupply and repair facilities during this mission. Expend weapons wisely. Limited reinforcements will be available.

Name_cn=巴拉望沿海的阴影
MissionSequenceName_cn=任务9
MapShortName_cn=09
Description_cn=菲律宾，普林塞萨港沿海
MissionImage_cn=campaigns/pacific-strike-task-force/art/pacific_strike_09_sheet.png
MissionIntro_cn=在击退进攻山打根的敌军后，盟军已做好对巴拉望岛发动两栖突击的准备。先对此区域进行反水面扫荡，再让海军陆战队第17远征队登上普林塞萨港。
MissionResupplyRules_cn=此任务期间，你的特遣舰队将在远离补给和维修设施的位置行动。请明智地使用武器。你可以获得有限的增援。

Name_ru=Гроза над Палаваном
MissionSequenceName_ru=МИССИЯ 9
MapShortName_ru=09
Description_ru=Пуэрто-Принсеса Сити, Филиппины
MissionIntro_ru=После отражения вражеской атаки на Сандакан союзники предпринимают высадку десанта на Палаван. Проведите зачистку территории, а затем высадите 17-й экспедиционный отряд морской пехоты в порту Пуэрто-Принсеса Сити.
MissionResupplyRules_ru=Ваша оперативная группа действует в отрыве от баз снабжения. Ремонт и пополнение боекомплекта недоступны. Используйте ваши ресурсы осмотрительно.

Name_de=SCHATTEN VOR PALAWAN
MissionSequenceName_de=MISSION 9
MapShortName_de=09
Description_de=Puerto Princesa City, Philippinen
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_09_sheet.png
MissionIntro_de=Nach der Abwehr des feindlichen Angriffs auf Sandakan haben sich die Alliierten Kräfte für einen Angriff auf Palawan gesammelt. Führen Sie eine Säuberung des Einsatzraums durch und landen Sie anschließend die 17th MAU bei Puerto Princesa.
MissionResupplyRules_de=Ihre Task Force operiert während dieser Mission abseits von Nachschub- und Reparatureinrichtungen. Setzen Sie Ihre Waffen mit Bedacht ein. Begrenzte Verstärkungen stehen zur Verfügung.

Name_ja=パラワン沖の影
MissionSequenceName_ja=ミッション 9
MapShortName_ja=09
Description_ja=フィリピン、プエルト・プリンセサ市
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_09_sheet.png
MissionIntro_ja=サンダカンへの敵の攻撃を退け、同盟軍はパラワン島への水陸両用強襲に向けて部隊を集結させた。周辺海域の敵水上部隊を掃討し、第17海兵両用部隊（17 MAU）をプエルト・プリンセサに上陸させよ。
MissionResupplyRules_ja=本ミッション中、任務部隊は補給および修理施設から離れて作戦行動を行うことになる。弾薬を計画的に使え。なお、利用できる増援には限りがある。

