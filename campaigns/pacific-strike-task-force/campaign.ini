Description_cn=印度尼西亚，巴厘岛（可选）
MissionImage_cn=campaigns/pacific-strike-task-force/art/pacific_strike_03b_sheet.png
MissionIntro_cn=可选：敌军对印度尼西亚和马来西亚的猛烈攻击使盟军陷入混乱，美军正在尝试在澳大利亚北部的达尔文重新集结。从你的特遣舰队中拆分出一个单位，坚守龙目海峡，为盟军关键运输单位向南撤退争取足够的时间。
MissionResupplyRules_cn=执行此任务的船只将在投入行动前补满弹药。
TaskForceModeBuilderSituation_cn=我们正在远离盟军主要基地的位置行动，增援力量仅限于此区域内的几艘船只。抵达澳大利亚后将有更多单位可用。

MissionSpecialNoteHighlightColor=Color.SeaPowerBlue
MissionSpecialNote_cn=注意：这是一项可选挑战任务。从你的特遣舰队中选择一艘船只执行此高风险、高回报任务。其他单位不会部署。完成此任务将为你在战役剩余部分中解锁更高级的军械。
TaskForceModeDebriefNoticeTitle_cn=已解锁强化船只配置！
TaskForceModeDebriefNoticeText_cn=使用特遣舰队组建器购买和装备新的配置。在上方的船只信息卡片中指定新的配置。

Name_ru=Оборона Ломбокского пролива
MissionSequenceName_ru=ДОП. МИССИЯ
MapShortName_ru=03Б
Description_ru=Бали, Индонезия
MissionIntro_ru=Интенсивные атаки противника на Индонезию и Малайзию привели к дезорганизации союзников, и американские войска пытаются перегруппироваться в Дарвине на севере Австралии. Выделите один из ваших кораблей чтобы удерживать Ломбокский пролив достаточно долго, чтобы критически важные транспортные корабли союзников смогли эвакуироваться на юг. Примечание: выполнение этой миссии разблокирует дополнительные боеприпасы и пополнение запасов в последующих миссиях кампании, а также повлияет на общее количество вражеских сил, доступных в будущих миссиях.
MissionResupplyRules_ru=Ваша оперативная группа действует в отрыве от баз снабжения. Ремонт и пополнение боекомплекта недоступны. Используйте ваши ресурсы осмотрительно.

MissionSpecialNote_ru=Примечание: это необязательная миссия повышенной сложности. Для выполнения этой миссии вам необходимо выделить один корабль из состава вашей группы. Другие корабли не будут развернуты. Выполнение этой миссии откроет новые варианты вооружения для кораблей.
TaskForceModeDebriefNoticeTitle_ru=Доступны новые варианты вооружения для кораблей!
TaskForceModeDebriefNoticeText_ru=Покупка новых вариантов вооружения осуществляется через Планировщик группы. Смена варианта вооружения осуществляется через карточку юнита в менеджере группы (расположен слева верху).

Name_de=DIE LOMBOKSTRASSE HALTEN
MissionSequenceName_de=NEBENMISSION
MapShortName_de=03B
Description_de=Bali, Indonesien (Optional)
MissionImage_de=campaigns/pacific-strike-task-force/art/pacific_strike_03b_sheet.png
MissionIntro_de=OPTIONAL: Schwere feindliche Angriffe gegen Indonesien und Malaysia haben die Alliierten schwer getroffen und US-Streitkräfte versuchen, sich in Darwin im Norden Australiens neu zu formieren. Kommandieren Sie eine Einheit Ihrer Task Force ab, um die Lombokstraße lange genug zu halten, damit wichtige alliierte Transporteinheiten nach Süden entkommen können. Hinweis: Der Abschluss dieser Mission schaltet für den Rest der Kampagne modernere Munition frei und wirkt sich auf die Anzahl der in künftigen Missionen verfügbaren feindlichen Kräfte aus.
MissionSpecialNote_de=Hinweis: Diese Herausforderung ist optional. Wählen Sie ein einziges Schiff aus Ihrer Task Force aus, um diese Mission durchzuführen. Es gilt: Großes Risiko, große Belohnung. Keine weiteren Einheiten werden eingesetzt.

Name_ja=ロンボク海峡死守
MissionSequenceName_ja=サイドミッション
MapShortName_ja=03B
Description_ja=インドネシア、バリ島（任意）
MissionImage_ja=campaigns/pacific-strike-task-force/art/pacific_strike_03b_sheet.png
MissionIntro_ja=任意：インドネシアおよびマレーシアに対する敵の激しい攻撃により同盟軍は混乱に陥り、米軍はオーストラリア北部のダーウィンにて部隊の再編・集結を試みている。重要な同盟軍輸送部隊が南方へ脱出する時間を稼ぐため、貴任務部隊から艦艇1隻を分派し、ロンボク海峡を死守せよ。
MissionResupplyRules_ja=本作戦への投入前に、選択した艦艇の弾薬は全量補充される。
MissionSpecialNote_ja=注記：本任務は任意のチャレンジミッションである。任務部隊から艦艇1隻を選び、危険だが見返りも大きいこの作戦に投入せよ。他のユニットは出撃しない。任務を達成すると、以後のキャンペーンで新型兵装が使用可能になる。
TaskForceModeBuilderSituation_ja=同盟軍の主要基地から離れて行動中であり、増援は現在この海域にいる数隻の艦艇に限られる。オーストラリア到着後は、さらに多くの艦艇を利用できる。
TaskForceModeDebriefNoticeTitle_ja=艦艇の新たな兵装構成が解禁！
TaskForceModeDebriefNoticeText_ja=任務部隊ビルダーで新たな兵装構成を購入・装備できる。上の各艦の情報カードから割り当てよ。

