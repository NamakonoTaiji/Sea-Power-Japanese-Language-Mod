Description=Контрнаступление союзников в Тихом океане продолжается. {TaskForceName} было приказано форсировать Ломбокский пролив и уничтожить все силы противника, действующие в этом районе. Успех ослабит давление на Индонезию и откроет путь для дальнейших операций на севере.
