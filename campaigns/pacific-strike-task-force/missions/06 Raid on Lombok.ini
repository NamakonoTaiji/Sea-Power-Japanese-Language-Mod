Taskforce1StartmessageMessage=Title=<size=24>Тихоокеанский Удар - Часть 6</size>\nРейд на Ломбок\n<size=24> 21 августа 1985</size>\nBody=Контрнаступление союзников на Тихом океане продолжается. {TaskForceName} было приказано очистить Ломбокский пролив от вражеских сил, чтобы уменьшить давление на Индонезию.\n\nУничтожьте все враждебные силы в проливе и устраните все вражеские береговые батареи, ЗРК и ракетные установки.\n\nПримечание: Вы не сможете пополнить боекомплект после этой миссии. Используйте оружие с умом.\nButtonText=Начать миссию\nPopupStyle=Intro
StartmessageForecast=Прогноз погоды для района Ломбока и Бали\nАктуален: 210000Z-210800Z Август 85\nВ районе пролива Ломбок сохраняются стабильные погодные условия: переменная или значительная облачность, северный ветер и умеренное волнение моря. Видимость хорошая, осадков в акватории пролива и на прилегающих участках не наблюдается. Ожидается, что условия останутся неизменными в течение всего рассматриваемого периода.
Taskforce1FlagshipmustsurviveMessage=Title=Поражение\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Разведка подтверждает уничтожение вражеских надводных сил в проливе Ломбок и ослабление береговой обороны противника вокруг аэродрома Бали.\n\n2. (S) Это открывает путь для 17-го отряда морской пехоты, который займётся возвращением аэродрома.\n\n3. (S) Отличная работа, командир. Двигайтесь на максимальной скорости к Сурабае и ожидайте дальнейших указаний. \nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
