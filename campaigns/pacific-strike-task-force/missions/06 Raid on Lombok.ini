Taskforce1StartmessageMessage=Title=<size=24>パシフィック・ストライク――第6部</size>\nロンボク強襲\n<size=24>1985年8月21日</size>\nBody=太平洋における同盟軍の反攻作戦が始まった。{TaskForceName}はインドネシアへの圧力を緩和するため、ロンボク海峡の敵戦力を一掃せよ。\n\n敵海軍戦力をすべて撃滅し、沿岸砲、地対空ミサイル（SAM）陣地、ミサイル砲台をすべて破壊せよ。\n\n注記：後続作戦が見込まれるが、本戦闘後に兵装の再補給は受けられない。兵装は慎重に使用せよ。\nButtonText=作戦開始\nPopupStyle=Intro
StartmessageForecast=バリ・ロンボク海域艦隊気象予報\n予報期間：85年8月21日0000Z～21日0800Z\nロンボク海峡の気象は安定している。雲は所々に広がり、厚い雲に覆われる所もある。北風が吹き、波は中程度。顕著な対流活動はなく、海峡と周辺海域の視程は良好で、降水もない。予報期間を通じて天候は安定し、水上・航空作戦に影響する大きな変化はない見込み。
Taskforce1FlagshipmustsurviveMessage=Title=作戦失敗\nBody=敗北！{FlagshipName}が撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官　パールハーバー、ハワイ州\nSubj=偵察報告――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 偵察により、ロンボク海峡の敵水上部隊の撃滅と、バリ島飛行場周辺の敵沿岸防御施設の制圧を確認した。\n\n2. (S) これにより海峡が開かれ、第17海兵両用部隊（17 MAU）が飛行場を奪還する道が開けた。\n\n3. (S) 見事な働きだ、指揮官。最大戦速で北上してスラバヤへ向かい、次の命令を待て。第77任務部隊指揮官より。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
