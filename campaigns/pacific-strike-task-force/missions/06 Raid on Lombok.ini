Taskforce1StartmessageMessage=Title=<size=24>Pacific Strike - Part 6</size>\nRAID ON LOMBOK\n<size=24>August 21st, 1985</size>\nBody=The Allied counteroffensive in the Pacific is underway. {TaskForceName} has been ordered to clear the Lombok Strait of enemy forces to relieve pressure on Indonesia.\n\nDestroy all hostile naval forces and eliminate all enemy shore guns, SAM sites, and missile batteries.\n\nNote: follow on operations are anticipated, and resupply of ordnance will not be available after this action. Expend weapons wisely.\nButtonText=Start mission\nPopupStyle=Intro
StartmessageForecast=FLEET WEATHER FORECAST FOR BALI LOMBOK AREA\nVALID: 210000Z-210800Z AUG 85\nLombok Strait is under stable conditions with broken to heavy cloud cover, northerly winds, and moderate seas. No significant convective activity is present, with good visibility and no precipitation across the strait and adjacent waters. Conditions are expected to remain steady throughout the period with no significant changes anticipated for surface or air operations.
Taskforce1FlagshipmustsurviveMessage=Title=DEFEAT\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=RECON REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Recon confirms hostile surface forces in Lombok Strait destroyed and enemy shore defenses around Bali airfield reduced.\n\n2. (S) This clears the strait and opens the door for 17 MAU to retake the airfield.\n\n3. (S) Excellent work, Commander. Proceed north at best speed to Surabaya and await further tasking. CTF 77 sends.\nButtonText=Return to mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyNavalUnits=Destroy enemy naval forces in Lombok Strait
Objective_DestroyShoreFacilities=Destroy all enemy shore guns, SAM sites, & missile batteries
