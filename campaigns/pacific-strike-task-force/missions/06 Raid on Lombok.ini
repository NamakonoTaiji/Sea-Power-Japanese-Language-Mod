Taskforce1StartmessageMessage=Title=<size=24>出击太平洋：第6部分</size>\n突袭龙目海峡\n<size=24>1985年8月21日</size>\nBody=盟军已在太平洋开始反攻。{TaskForceName}收到命令清理龙目海峡，缓解印度尼西亚的压力。\n\n消灭所有敌方海军部队、岸炮、面对空导弹阵地和反舰导弹发射器。\n\n注意：此任务后无军械补给，请明智地使用武器，为后续行动预留。\nButtonText=开始任务\nPopupStyle=Intro
StartmessageForecast=巴厘岛龙目岛区域舰队天气预报\n有效期：1985年8月21日0000Z时至21日0800Z时\n龙目海峡目前天气稳定，云量最低为多云，北风，海况为3级。海峡及邻近海域无明显对流活动，能见度良好，无降水。在此期间，预计天气状况将保持稳定，水面和空中行动条件不会发生重大变化。
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）侦察确认龙目海峡内的敌方水面部队已被摧毁，巴厘岛机场附近的敌方岸防力量已被削弱。\n\n2.（机密）你成功清理了海峡，为海军陆战队第17远征队夺回机场铺平了道路。\n\n3.（机密）干得好，指挥官。以最佳速度北上前往泗水，等待进一步命令。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
