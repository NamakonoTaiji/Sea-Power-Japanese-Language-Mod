[Language_ja]
Name=06 ロンボク強襲
Description=太平洋における同盟軍の反攻作戦が開始された。{TaskForceName}はロンボク海峡を強行突破し、同海域で活動するすべての敵戦力を撃滅せよとの命令を受けた。作戦が成功すれば、インドネシアへの圧力が緩和され、さらなる北方での攻勢作戦への道が開かれることになる。
