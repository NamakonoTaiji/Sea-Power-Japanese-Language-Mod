[Language_cn]
Name=06突袭龙目海峡
Description=盟军已在太平洋开始反攻。{TaskForceName}收到命令清理龙目海峡，消灭在此区域内活动的所有敌军。此次行动的成功将缓解印度尼西亚的压力并为向北推进的后续行动铺平道路。
