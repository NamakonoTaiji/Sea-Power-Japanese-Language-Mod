Taskforce1StartmessageMessage=Title=<size=24>Pacific Strike - Teil 6</size>\nANGRIFF AUF LOMBOK\n<size=24>21. August 1985</size>\nBody=Die alliierte Gegenoffensive im Pazifik hat begonnen. {TaskForceName} hat den Befehl erhalten, die Lombokstraße von feindlichen Kräften zu säubern, um den Druck auf Indonesien zu verringern.\n\nZerstören Sie alle feindlichen Seestreitkräfte und schalten Sie sämtliche feindlichen Küstengeschütze, SAM-Stellungen und Flugkörperbatterien aus.\n\nHinweis: Es werden Folgeoperationen werden erwartet, daher ist nach diesem Einsatz kein Aufrüsten bzw. Aufmunitionieren möglich. Setzen Sie Ihre Wirkmittel daher mit Bedacht ein.\nButtonText=Mission starten\nPopupStyle=Intro
StartmessageForecast=FLOTTEN-WETTERVORHERSAGE FÜR DEN RAUM BALI-LOMBOK\nGÜLTIG: 210000Z-210800Z AUG 85\nIn der Lombokstraße herrschen stabile Bedingungen mit aufgelockerter bis starker Bewölkung, Wind aus Norden und mäßiger See. Es gibt keine nennenswerte konvektive Aktivität, in der Meerenge und den angrenzenden Gewässern herrschen gute Sichtverhältnisse ohne Niederschlag. Die Bedingungen bleiben voraussichtlich während des gesamten Zeitraums stabil, ohne wesentliche Änderungen für See- oder Luftoperationen.
Taskforce1FlagshipmustsurviveMessage=Title=BESIEGT\nBody=Niederlage! {FlagshipName} wurde versenkt!\nButtonText=Zurück zur Mission\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=AUFKLÄRUNGSMELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Aufklärung bestätigt, dass die feindlichen Überwasserkräfte in der Lombokstraße zerstört und die feindlichen Küstenstellungen um den Flugplatz Bali niedergekämpft wurden.\n\n2. (S) Damit ist die Meerenge offen und der Weg für 17 MAU zur Rückeroberung des Flugplatzes frei. Indonesien erhält Luft, und wir erhalten einen Weg nach Norden.\n\n3. (S) Gute Arbeit, Kommandant. Halten Sie verbleibende Munition zurück und erwarten Sie Folgeaufträge. CTF 77 Ende.\nButtonText=Zurück zur Mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyNavalUnits=Zerstören Sie feindliche Seestreitkräfte in der Lombokstraße
Objective_DestroyShoreFacilities=Zerstören Sie alle feindlichen Küstengeschütze, SAM-Stellungen und Flugkörperbatterien
