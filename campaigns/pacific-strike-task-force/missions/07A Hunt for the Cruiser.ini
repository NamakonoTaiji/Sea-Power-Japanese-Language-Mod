Name=07A 巡洋艦捕捉
Description=スラヴァ水上戦闘群がスールー海のどこかに潜伏しているとの情報あり。HMASオリオンを指揮し、敵の位置を特定して撃沈せよ。
MapSymbol_New1Label_ja=南シナ海
MapSymbol_New2Label_ja=スラヴァ水上戦闘群
MapSymbol_New3Label_ja=新規シンボル
MapSymbol_New4Label_ja=?
MapSymbol_New5Label_ja=敵対潜航空部隊
Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――潜水艦チャレンジ2</size>\n巡洋艦捕捉\n<size=24>1985年9月23日</size>\nBody=南シナ海でスラヴァ水上戦闘群が確認され、同盟軍潜水艦に撃沈命令が下った。情報部は、この戦闘群がパラワン島の敵戦力増強へ向かう揚陸艦を護衛しており、敵潜水艦も支援している可能性が高いとみている。カムラン湾を拠点とする長距離海上哨戒機も同海域で活動中だ。\n\nスラヴァを捜索・撃沈せよ。他の敵部隊の撃滅は任意とする。\nButtonText=作戦開始\nPopupStyle=Intro
StartForecast=スプラトリー諸島海域艦隊気象予報\n予報期間：85年9月23日0500Z～23日1200Z\n現地時間0500時のスプラトリー諸島周辺では嵐が続いているが、気圧傾度の弱まりとともに間もなく和らぎ始め、北西風も徐々に弱まる見込み。0600時ごろまでに波浪は海象状態5（シーステート5）から海象状態4（シーステート4）へと収まり、雨も弱まって止む。ただし、残る雲や所々の霧で視程が制限される可能性がある。現地時間1200時にかけて天候は改善するものの、なお穏やかとはいえない状態が続き、予報期間中に嵐が再発する見込みはない。
Taskforce1OrionmustsurviveMessage=Title=作戦失敗\nBody=敗北！HMASオリオンが撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Taskforce1Slavasunk-playervictoryMessage=From=海上総司令部\nTo=HMASオリオン\nInfo=太平洋艦隊潜水艦部隊司令官　パールハーバー、ハワイ州\n太平洋艦隊司令長官　パールハーバー、ハワイ州\nSubj=潜水艦報告――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1. (S) 9月23日のスラヴァ撃沈成功の報告を本司令部は受領した。\n\n2. (S) スラヴァの喪失により南シナ海の主要なミサイル脅威は取り除かれ、我が方への作戦に投入可能な敵戦力は大きく損なわれた。\n\n3. (S) 見事な働きだ、指揮官。機会があり次第、乗組員がオリオンの戦果板に赤い巡洋艦を描くことを許可する。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroySlava=スラヴァの撃沈
Objective_OrionMustSurvive=HMASオリオンの生存
Objective_DestroySAG=任意目標：すべての敵水上部隊の撃滅
