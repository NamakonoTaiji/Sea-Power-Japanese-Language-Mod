Taskforce1StartMessage=Title=<size=24>出击太平洋：潜艇挑战2</size>\n猎杀巡洋舰\n<size=24>1985年9月16日</size>\nBody=报告显示光荣号水面行动群出现在了南海某处，盟军潜艇收到命令将其摧毁。情报表明此水面行动群正在为一艘前往巴拉望增援的两栖舰艇提供护航，附近可能还有前来支援的潜艇。此外，从金兰湾起飞的远程海上巡逻机也在此区域内行动。\n\n找到并击沉光荣号，其他敌方单位是可选目标。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=南沙群岛区域舰队天气预报\n有效期：1985年9月15日2200Z时至16日0500Z时\n9月15日2200Z时，南沙群岛上空的风暴将开始散去，西北风将随着气压梯度一同减小。海况将于2300Z时左右由5级降至4级，同时降雨渐停，但残留云层和局部的雾仍可能影响能见度。4级海况将持续到16日0500Z时，在此期间不会再次出现风暴。
Taskforce1OrionmustsurviveMessage=Title=任务失败！\nBody=任务失败！俄里翁号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1Slavasunk-playervictoryMessage=From=海军总部\nTo=俄里翁号潜艇\nInfo=夏威夷州珍珠港太平洋潜艇部队司令\n太平洋舰队总司令\nSubj=潜艇报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1.（机密）总部已收到你于9月16日成功击沉光荣号的报告。\n\n2.（机密）通过击沉此舰，你消除了南海方向的重大导弹威胁，并严重削弱了敌方可用的战斗力量。\n\n3.（机密）干得漂亮，指挥官。即刻授权你的船员在俄里翁号的记分板上画一艘红色巡洋舰。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroySlava=击沉光荣号
Objective_OrionMustSurvive=俄里翁号不能被击沉
Objective_DestroySAG=可选：消灭所有敌方水面单位
