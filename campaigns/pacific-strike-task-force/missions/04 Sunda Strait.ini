Taskforce1Playershipsreacharea-playerwinsMessage=From=Ком ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Ваш доклад о местоположении получен и подтвержден. Отличная работа по преодолению пролива, несмотря на сопротивление противника.\n\n2. (S) Союзные силы в регионе находятся под сильным давлением, и сохранение сил является приоритетом. Двигайтесь в Дарвин и ждите дальнейших приказов.\n\n3. (S) Поздравляем, командир! Вы провели ваши силы через опасный район и сохранили боеспособность оперативной группы.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1StartMessage=Title=<size=24>Тихоокеанский Удар - Часть 4</size>\nЗондский пролив\n<size=24>Июль 15-е, 1985</size>\nBody=Войска союзников получили приказ отступить в Австралию. {TaskForceName} пытается выйти из Яванского моря, едва уцелев после вражеского наступления. Прорвитесь через Зондский пролив в открытый океан, чтобы продолжить борьбу.\n\nРазведка сообщает о наличии как минимум одной вражеской подводной лодки в районе пролива. Также ожидается оживленное движение гражданских судов. \nButtonText=Start mission\nPopupStyle=Intro
StartForecast=Прогноз погоды для Зондского пролива\nАктуален: 152300Z-160500Z JUL 85\nВ районе Зондского пролива в период с 23:00 (время UTC) 15 июля 1985 года до 05:00 (время UTC) сохранится устойчивая погода. Умеренный юго-западный ветер будет поддерживать волнение моря в пределах 3 баллов. Ожидается переменная облачность и хорошая видимость. Туман и осадки не прогнозируются. Существенных изменений погодных условий в течение указанного периода не предвидится.
Taskforce1SealiftCaribbeanSeamustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! Ваш танкер был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1KilopresencemessageMessage=From=Ком ТГ 77\nTo={TaskForceName}\nInfo=\nSubj=SUBMARINE THREAT UPDATE-SUNDA STRAIT\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Командование подводных сил Тихоокеанского флота сообщает, что 8 июля АПЛ USS HOUSTON вступила в бой и уничтожила значительную группу вражеских подводных лодок к северу от вашей позиции. \n\n2. (S) Разведка полагает что перед этими силами стояла задача перекрыть Зондский пролив. \n\n3. (S) Мы считаем, что угроза со стороны подводных лодок для вашего соединения существенно снизилась, однако при прохождении пролива соблюдайте осторожность. \n\n3. (S) Удачи и до встречи в Дарвине.\nButtonText=Подтвердить и продолжить\nPopupStyle=NavalMessage
Taskforce1+30minRNZAFcheckinMessage=Title=Сообщение по УКВ\nBody=«{TaskForceName}, на связи "Киви-1", мы в ста милях к югу от пролива, подходим с юга. Вооружены бомбами Мк 82 и НУРС. Имеем топлива примерно на полчаса. Готовы к получению задачи, прием».\nButtonText=Принято\nPopupStyle=Notification
Taskforce1+1hrRNZAFcheckoutMessage=Title=Сообщение по УКВ\nBody=«{TaskForceName}, на связи "Киви-1": топливо на исходе, уходим на дозаправку. Удачи! "Киви-1", конец связи.»\nButtonText=Продолжить\nPopupStyle=Notification
Objective_ReachObjectiveArea=Прорвитесь через Зондский пролив.
Objective_FlagshipMustSurvive={FlagshipName} должен уцелеть
