Taskforce1Playershipsreacharea-playerwinsMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=POSITIONSMELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Ihre abschließende Positionsmeldung wurde empfangen und bestätigt. Ausgezeichnete Arbeit beim Freikämpfen durch die Meerenge trotz feindlicher Einwirkung.\n\n2. (S) Die alliierten Kräfte in der Region stehen unter starkem Druck und der Erhalt eigener Kräfte hat Priorität. Verlassen Sie den Einsatzraum in Richtung Darwin und erwarten Sie weitere Befehle.\n\n3. (S) Gut gemacht, Kommandant. Sie haben Ihre Schiffe durch einen gefährlichen Rückzug geführt und die Task Force kampfbereit gehalten. CTF 77 Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! {FlagshipName} wurde versenkt!\nButtonText=Weiterspielen\nPopupStyle=Outro
Taskforce1StartMessage=Title=<size=24>Pacific Strike - Teil 4</size>\nSUNDASTRASSE\n<size=24>15. Juli 1985</size>\nBody=Alliierte Kräfte haben den Befehl erhalten, sich nach Australien zurückzuziehen. {TaskForceName} versucht, aus der Javasee zu entkommen, nachdem sie während der feindlichen Offensive beinahe vernichtet wurde. Durchqueren Sie die Sundastraße und entkommen Sie auf die offene See.\n\nDer Nachrichtendienst meldet mindestens ein feindliches U-Boot in der Nähe der Meerenge. Rechnen Sie außerdem mit starkem zivilen Schiffsverkehr.\nButtonText=Mission starten\nPopupStyle=Intro
StartForecast=FLOTTEN-WETTERVORHERSAGE FÜR DIE SUNDASTRASSE\nGÜLTIG: 152300Z-160500Z JUL 85\nIn der Sundastraße herrschen vom 15. Juli 1985, 2300Z, bis 0500Z stabile Wetterbedingungen. Ein leichte bis mäßiger Südwestwind sorgt für leichte bis mäßige See bei einem Seegang der Stufe 3. Aufgelockerte bis starke Bewölkung bleibt bestehen, bei guter Sicht, Nebel oder Niederschlag werden nicht erwartet. Im Vorhersagezeitraum ist keine wesentliche Änderung der Wetterbedingungen zu erwarten.
Taskforce1SealiftCaribbeanSeamustsurviveMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! Der Tanker wurde versenkt. Sie schließen sich der USS Houston und der HMAS Perth auf dem Grund der Sundastraße an!\nButtonText=Weiterspielen\nPopupStyle=Outro
Taskforce1KilopresencemessageMessage=From=CTF 77\nAn={TaskForceName}\nTo=\nInfo=\nSubj=U-BOOT-BEDROHUNGSLAGE - SUNDASTRASSE\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) COMSUBPAC meldet, dass die USS HOUSTON am 08JUL nördlich Ihrer Position ein feindliches U-Boot-Wolfsrudel angegriffen und zerstört hat. \n\n2. (S) Der Nachrichtendienst geht davon aus, dass diese Einheiten mit der Abriegelung der Sundastraße beauftragt waren. \n\n3. (S) Wir bewerten die U-Boot-Bedrohung für Ihre Kräfte als deutlich verringert, dennoch ist während der Durchfahrt durch die Meerenge Vorsicht geboten.\n\n3. (S) CTF 77 spendiert der Besatzung der HOUSTON in Darwin die erste Runde. Viel Glück, wir sehen uns dort. CTF 77 Ende.\nButtonText=Bestätigen und fortfahren\nPopupStyle=NavalMessage
Taskforce1+30minRNZAFcheckinMessage=Title=UHF-LUFTKOORDINATIONSNETZ\nBody="{TaskForceName}, Kiwi One, Rotte aus zwei Skyhawks, eins-null-null Meilen südlich der Meerenge, über Wasser, aus Süden einfliegend. Beladen mit Mark-82-Bomben und Raketen. Drei-null Minuten auf Station, bevor wir Bingo zum Tanker erreichen. Bereit für Einsatzauftrag, kommen."\nButtonText=Bestätigen und fortfahren\nPopupStyle=Notification
Taskforce1+1hrRNZAFcheckoutMessage=Title=UHF-LUFTKOORDINATIONSNETZ\nBody="{TaskForceName}, hier Kiwi 1, wir sind Bingo Fuel und brechen zum Tanker ab. Viel Glück da draußen. Kiwi 1 Ende."\nButtonText=Bestätigen und fortfahren\nPopupStyle=Notification
Objective_ReachObjectiveArea=Durchqueren Sie die Sundastraße, um zu entkommen
