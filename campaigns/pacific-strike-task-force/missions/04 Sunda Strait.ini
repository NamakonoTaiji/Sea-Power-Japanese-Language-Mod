Taskforce1Playershipsreacharea-playerwinsMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=POSITION REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Your final position report is received and acknowledged. Excellent work clearing the strait despite hostile action.\n\n2. (S) Allied forces in the region are under heavy pressure and preservation of forces is the priority. Clear the area to Darwin, then await further orders.\n\n3. (S) Well done, Commander. You brought your ships through a dangerous withdrawal and kept the task force in the fight. CTF 77 sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Taskforce1StartMessage=Title=<size=24>Pacific Strike - Part 4</size>\nSUNDA STRAIT\n<size=24>July 15th, 1985</size>\nBody=Allied forces have been ordered to retreat to Australia. {TaskForceName} is attempting to escape the Java Sea after being nearly destroyed during the enemy offensive. Run the Sunda Strait and escape to open ocean to live to fight another day.\n\nIntel reports at least one enemy submarine in the vicinity of the strait. Expect heavy civilian traffic as well.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR SUNDA STRAIT\nVALID: 152300Z-160500Z JUL 85\nStable weather conditions will prevail in the Sunda Strait from 2300Z 15 July 1985 through 0500Z, with a light to moderate southwesterly flow maintaining slight to moderate seas at Sea State 3. Broken cloud cover will persist with good visibility, and no fog or precipitation is expected. No significant change in weather conditions is anticipated during the period.
Taskforce1SealiftCaribbeanSeamustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! The tanker has been sunk. You join the USS Houston and HMAS Perth at the bottom of the Sunda Strait!\nButtonText=Return to mission\nPopupStyle=Outro
Taskforce1KilopresencemessageMessage=From=CTF 77\nTo={TaskForceName}\nInfo=\nSubj=SUBMARINE THREAT UPDATE-SUNDA STRAIT\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) COMSUBPAC reports USS HOUSTON engaged and destroyed a significant enemy submarine wolfpack north of your position 08JUL. \n\n2. (S) Intel assesses these units were tasked with closing Sunda Strait. \n\n3. (S) We assess submarine threat to your force will be greatly diminished, but exercise caution while transiting the strait.\n\n3. (S) CTF 77 buys first round for crew of HOUSTON at Darwin. Good luck and we will see you there. CTF 77 sends.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Taskforce1+30minRNZAFcheckinMessage=Title=UHF AIR COORDINATION NET\nBody=“{TaskForceName}, Kiwi One, section of two Skyhawks, one-zero-zero miles south of the Strait, feet wet, inbound from the south. Loaded with Mark Eighty-Twos and rockets. Three-zero minutes on station before bingo to tanker. Ready for tasking, over."\nButtonText=Acknowledge & continue\nPopupStyle=Notification
Taskforce1+1hrRNZAFcheckoutMessage=Title=UHF AIR COORDINATION NET\nBody="{TaskForceName}, this is Kiwi 1, we are bingo fuel and bugging out to the tanker. Good luck out there. Kiwi 1 out."\nButtonText=Acknowledge & continue\nPopupStyle=Notification
Objective_ReachObjectiveArea=Run the Sunda Strait to escape
Objective_FlagshipMustSurvive={FlagshipName} must survive
Objective_SealiftCaribbeanSeaMustSurvive=M/V Sealift Caribbean Sea must survive
[Language_cn]
Name=04巽他海峡
Description=新加坡和印度尼西亚遭到了敌方猛烈海空攻击的压制，此区域内的美军已收到命令撤退并重新集结。率领{TaskForceName}穿越巽他海峡，抵达公海，保存实力以图来日再战。
MapSymbol_New1Label_cn=New Symbol
MapSymbol_New2Label_cn=New Symbol
MapSymbol_New3Label_cn=到达此区域以撤离！
MapSymbol_New4Label_cn=敌方水面部队
MapSymbol_New5Label_cn=New Symbol
MapSymbol_New6Label_cn=？
MapSymbol_New7Label_cn=苏门答腊
MapSymbol_New8Label_cn=爪哇岛
MapSymbol_New9Label_cn=巽他海峡
MapSymbol_New10Label_cn=防空炮
Trigger1Condition_Condition1AreaLabel=到达此区域以撤离！
Taskforce1Playershipsreacharea-playerwinsMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=位置报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）已收到并确认你的最后位置报告。虽然遭遇敌对行动，但你出色完成了穿越海峡的任务。\n\n2.（机密）此地区内的盟军部队面临巨大压力，保存实力是首要任务。离开此区域并前往达尔文，等待进一步命令。\n\n3.干得好，指挥官。你带领你的部队完成了一次危险的撤退，保存了特遣舰队的战斗力。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1StartMessage=Title=<size=24>出击太平洋：第4部分</size>\n巽他海峡\n<size=24>1985年7月15日</size>\nBody=盟军已收到命令撤退至澳大利亚。{TaskForceName}在敌军进攻中几乎全军覆没，正在尝试撤离爪哇海。穿越巽他海峡，抵达公海，保存实力以图来日再战。\n\n情报显示海峡附近至少有一艘敌方潜艇，预计还有大量民用船只通行。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=巽他海峡舰队天气预报\n有效期：1985年7月15日2300Z时至16日0500Z时\n1985年7月15日2300Z时至次日0500Z时，巽他海峡天气状况稳定，有中低强度西南风，海况为3级。多云，能见度良好，预计无雾或降水。在此期间，天气状况预计不会发生重大变化。
Taskforce1SealiftCaribbeanSeamustsurviveMessage=Title=任务失败！\nBody=任务失败！油船已被击沉。你加入了巽他海峡海底的休斯顿号和珀斯号！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1KilopresencemessageMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=\nSubj=潜艇威胁更新——巽他海峡\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）太平洋潜艇部队司令发来报告称休斯顿号潜艇于7月8日在你的位置以北与一个强大的敌方潜艇狼群交战并将其消灭。\n\n2.（机密）情报部门评估认为这些单位的任务是封锁巽他海峡。\n\n3.（机密）我们评估认为潜艇对你的威胁将大幅降低，但穿越海峡时仍需谨慎。\n\n4.（机密）第77特遣舰队指挥官在达尔文为休斯顿号的船员们准备了庆功酒。祝你好运，我们在那里相见。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Taskforce1+30minRNZAFcheckinMessage=Title=特高频空中协调网\nBody={TaskForceName}，我们是两架天鹰攻击机组成的编组鹬鸵1号，携带Mk82炸弹和火箭弹，目前位于海峡以南100英里的海面上，正在从南方靠近，30分钟后燃料将到达返航阈值。准备执行任务，完毕。\nButtonText=收到并继续\nPopupStyle=Notification
Taskforce1+1hrRNZAFcheckoutMessage=Title=特高频空中协调网\nBody={TaskForceName}，这里是鹬鸵1号，我们仅剩返航燃料，必须撤退。祝你好运。鹬鸵1号完毕。\nButtonText=收到并继续\nPopupStyle=Notification
