Taskforce1Playershipsreacharea-playerwinsMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官（ハワイ州パールハーバー）\nSubj=位置報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 貴部隊の最終位置報告を受領、確認した。敵の妨害を受けながら海峡を突破した働きは見事である。\n\n2. (S) この地域の同盟軍は強い圧力を受けており、戦力の温存が最優先である。ダーウィンへ向けて海域を離脱し、同地で次の命令を待て。\n\n3. (S) よくやった、指揮官。危険な撤退戦で艦艇を無事に導き、任務部隊の戦力を保った。第77任務部隊指揮官より。\nButtonText=プレイを続ける\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=作戦失敗\nBody=敗北！ {FlagshipName}が撃沈された！\nButtonText=ミッションへ戻る\nPopupStyle=Outro
Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――第4部</size>\nスンダ海峡\n<size=24>1985年7月15日</size>\nBody=同盟軍はオーストラリアへの撤退を命じられた。{TaskForceName}は敵の攻勢で壊滅寸前に追い込まれ、ジャワ海からの脱出を図っている。スンダ海峡を突破して外洋へ逃れ、再起の機会をつかめ。\n\n情報部によれば、海峡付近には少なくとも敵潜水艦1隻がいる。民間船舶も多数航行していると予想される。\nButtonText=ミッション開始\nPopupStyle=Intro
StartForecast=スンダ海峡艦隊気象予報\n有効期間：85年7月15日2300Z～16日0500Z\n7月15日2300Zから16日0500Zまで、スンダ海峡の天候は安定する見込みである。弱～中程度の南西風が吹き、海況3で波は低～中程度となる。雲は切れ間を残しながら広がるが視程は良好で、霧や降水は予想されない。予報期間中に天候が大きく変わる見込みはない。
Taskforce1SealiftCaribbeanSeamustsurviveMessage=Title=作戦失敗\nBody=敗北！ タンカーが撃沈された。貴部隊もUSSヒューストンやHMASパースとともにスンダ海峡の海底に沈むことになる！\nButtonText=ミッションへ戻る\nPopupStyle=Outro
Taskforce1KilopresencemessageMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=\nSubj=潜水艦脅威情報――スンダ海峡\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 太平洋艦隊潜水艦部隊司令官（COMSUBPAC）によれば、USSヒューストンは7月8日、貴部隊の北方で有力な敵潜水艦群（ウルフパック）と交戦し、これを撃滅した。\n\n2. (S) 情報部は、これらの潜水艦がスンダ海峡の封鎖任務を負っていたと判断している。\n\n3. (S) 貴部隊に対する潜水艦の脅威は大幅に減ったとみられるが、海峡の通航中は警戒を怠るな。\n\n3. (S) ダーウィンでは、ヒューストンの乗組員の最初の一杯を私がおごろう。諸君の健闘を祈る。現地で会おう。第77任務部隊指揮官より。\nButtonText=了解して続行\nPopupStyle=NavalMessage
Taskforce1+30minRNZAFcheckinMessage=Title=UHF航空調整回線\nBody=「{TaskForceName}、こちらキウイ1。スカイホーク2機編隊、海峡の南100マイル、海上を南から接近中。Mk 82爆弾とロケット弾を搭載。給油機へ向かうための帰投燃料に達するまで、作戦空域に30分滞在可能。任務指示を待つ、どうぞ」\nButtonText=了解して続行\nPopupStyle=Notification
Taskforce1+1hrRNZAFcheckoutMessage=Title=UHF航空調整回線\nBody=「{TaskForceName}、こちらキウイ1。帰投燃料に達したため給油機へ向かう。諸君の健闘を祈る。キウイ1、通信終わり」\nButtonText=了解して続行\nPopupStyle=Notification
