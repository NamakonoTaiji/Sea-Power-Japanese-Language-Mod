[Language_ja]
Name=03B ロンボク海峡死守
Description=インドネシアとマレーシアに対する敵の激しい攻撃で同盟軍は混乱に陥り、米軍はオーストラリア北部のダーウィンで部隊の再編・集結を図っている。重要な同盟軍輸送部隊が南方へ脱出する時間を稼ぐため、貴任務部隊から艦艇1隻が分派され、ロンボク海峡を守る任務に就いた。
MapSymbol_New1Label_ja=バリ島
MapSymbol_New2Label_ja=ロンボク島
MapSymbol_New3Label_ja=ソ連水上襲撃部隊
