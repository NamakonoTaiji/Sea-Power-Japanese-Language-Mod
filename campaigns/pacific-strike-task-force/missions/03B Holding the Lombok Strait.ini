[Language_ru]
Name=Оборона Ломбокского пролива
Description=Интенсивные атаки противника на Индонезию и Малайзию привели к дезорганизации союзников, и американские войска пытаются перегруппироваться в Дарвине на севере Австралии. Один корабль из вашей группы получил приказ удерживать Ломбокский пролив достаточно долго, чтобы критически важные транспортные корабли союзников смогли эвакуироваться на юг.
