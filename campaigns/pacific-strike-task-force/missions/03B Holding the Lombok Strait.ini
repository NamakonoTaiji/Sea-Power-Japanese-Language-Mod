MapSymbol_New7Label_ja=新規シンボル
MapSymbol_New8Label_ja=ロンボク海峡
Taskforce2Vessel2NameOverride=ヴォズブジュデーンヌイ BPK-725
Taskforce2Vessel2ShortNameOverride=ヴォズブジュデーンヌイ
Trigger4Condition_Condition1AreaLabel=データムA01
Taskforce1StartmessageMessage=Title=<size=24>パシフィック・ストライク――艦艇チャレンジ1</size>\nロンボク海峡死守\n<size=24>1985年7月12日</size>\nBody=同盟軍はオーストラリアへ撤退している。ソ連の襲撃部隊によるロンボク海峡の封鎖を阻止するため、{SelectedUnitName}は従来の任務から分派された。\n\n敵航空部隊が水上襲撃部隊の援護に出撃する見込みであり、同海域では少なくともキロ（KILO）型通常型潜水艦（SSK）1隻が活動している疑いがある。すべての敵水上艦艇と遭遇した潜水艦を撃滅せよ。\nButtonText=ミッション開始\nPopupStyle=Intro
StartmessageForecast=ロンボク海峡艦隊気象予報\n有効期間：85年7月12日0200Z～0800Z\nロンボク海峡では南東の季節風が夜間も吹き続け、雲はまばらで、海況は3、波は中程度となる見込みである。顕著な降雨や霧は予想されず、海峡全域とバリ島・ロンボク島への接近海域では良好な視程が続く。午前当直の間も気象条件は安定するが、海峡内で風が強まる区域では局地的な突風が起こる可能性がある。
Taskforce1SelectedunitmustsurviveMessage=Title=作戦失敗\nBody=敗北！ {SelectedUnitName}が撃沈された！\nButtonText=ミッションへ戻る\nPopupStyle=Outro
Taskforce1DatumA01messageMessage=From=太平洋艦隊司令長官（CINCPACFLT）\nTo={SelectedUnitName}艦長\nInfo=\nSubj=接触報告――通常型潜水艦データムA01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 警告：無線傍受によると、ロンボク海峡北方で通常型潜水艦（SSK）1隻が活動中である。\n\n2. (S) 0130Z、南緯8.11度、東経115.8度にデータムA01を設定した。\n\n3. (S) 当該目標を必ず撃沈せよ。諸君の健闘と武運を祈る。\nButtonText=了解して続行\nPopupStyle=NavalMessage
Taskforce1DatumA01messageIntel=無線傍受によると、ソ連の潜水艦が北方からロンボク海峡へ進入中である。地図上にデータムA01を表示した。
Taskforce1Destroyenemyships-playervictoryMessage=From=第77任務部隊指揮官（CTF 77）\nTo={SelectedUnitName}艦長\nInfo=太平洋艦隊司令長官（ハワイ州パールハーバー）\nSubj=偵察報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 偵察によると、ロンボク海峡の封鎖を図っていたソ連襲撃部隊の主力は撃滅された。\n\n2. (S) 情報部は今後72時間以内にキーロフ（KIROV）を含むソ連海軍部隊が後続作戦を実施する可能性が高いとみている。しかし、0300Z時点で重要な同盟軍輸送部隊はすべて海峡を抜けている。\n\n3. (S) 2200Zまでバリ島沖にとどまり、その後{TaskForceName}と合流してダーウィンへ向け海域を離脱せよ。よくやった（BZ）。第77任務部隊指揮官より。\nButtonText=プレイを続ける\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyRaidingForce=敵襲撃部隊を撃滅せよ
Objective_DestroyEnemySub=遭遇した敵潜水艦を撃沈せよ
