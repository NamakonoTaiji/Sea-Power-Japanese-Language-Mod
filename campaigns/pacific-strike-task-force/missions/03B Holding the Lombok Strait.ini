Trigger4Condition_Condition1AreaLabel=Зона A01
Taskforce1StartmessageMessage=<size=24>Необязательная миссия:</size><size=32>\nОборона Ломбокского пролива</size>\n<size=24>Июль 12-е, 1985</size>|Союзные силы отступают к Австралии. Один из ваших кораблей, {SelectedUnitName}, отделился от основной группы, чтобы не допустить перекрытия пролива Ломбок рейдовыми силами СССР.\n\nДля прикрытия рейдовой группы противник задействует авиацию|Close
StartmessageForecast=Прогноз погоды\nВАЛИД: 120200Z-120800Z Июль 85\nЮго-восточный муссон над Ломбокским проливом сохраниться в течении ночи. Ожидается переменная облачность и умеренное волнение моря (3 балла). Существенных осадков или тумана не прогнозируется, видимость в проливе и на подходах к островам Бали и Ломбок останется хорошей. Ожидается, что утром метеоусловия останутся стабильными, однако над проливом возможны локальные порывы ветра.
Taskforce1SelectedunitmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {SelectedUnitName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1DatumA01messageMessage=From=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nTo=Ком. {SelectedUnitName}\nInfo=\nSubj=Обнаружена вражеская подлодка\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) ПРЕДУПРЕЖДЕНИЕ: Радиоперехват указывает на то что ДПЛ типа «Палтус» движется к Ломбокскому проливу с севера.\n\n2. (S) Зона вероятного нахождения А01 отмечена на карте. Координаты: 8.11ю.ш., 115.8в.д. Время отметки: 0130Z.\n\n3. (S) Данная подлодка должна быть уничтожена.\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce1DatumA01messageIntel=Радиоперехват указывает на то что ДПЛ типа «Палтус» движется к Ломбокскому проливу с севера. Зона вероятного нахождения А01 обозначена на карте. Координаты: 8.11ю.ш., 115.8в.д. Время отметки: 0130Z.
Taskforce1Destroyenemyships-playervictoryMessage=From=Ком. ТГ 77\nTo=Ком. {SelectedUnitName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Routine\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) По данным разведки, основные силы советского рейдового отряда, пытавшегося перекрыть пролив Ломбок, уничтожены. \n\n2. (S) Согласно оценкам разведки, в ближайшие 72 часа возможно прибытие новых советских военно-морских сил (включая крейсер «Киров»), однако по состоянию на 03:00 (Z) все критически важные транспорты союзников уже вышли из пролива. \n\n3. (S) Оставайтесь в районе острова Бали до 22:00 (Z), затем соединитесь с {TaskForceName} и следуйте в Дарвин. Отлично сработано — Командующий оперативным соединением 77 (Ком ТГ 77).\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyRaidingForce=Уничтожить вражескую КУГ
Objective_DestroyEnemySub=Найти и уничтожить вражескую подводную лодку
Objective_SelectedUnitMustSurvive=Корабль {SelectedUnitName} должен уцелеть
[Language_de]
Name=03B Die Lombokstraße halten
Description=Schwere feindliche Angriffe gegen Indonesien und Malaysia haben die Alliierten schwer getroffen und US-Streitkräfte versuchen, sich in Darwin im Norden Australiens neu zu formieren. Kommandieren Sie eine Einheit Ihrer Task Force ab, um die Lombokstraße lange genug zu halten, damit wichtige alliierte Transporteinheiten nach Süden entkommen können.
