[Language_cn]
Name=03B坚守龙目海峡
Description=敌军对印度尼西亚和马来西亚的猛烈攻击使盟军陷入混乱，美军正在尝试在澳大利亚北部的达尔文重新集结。从你的特遣舰队中拆分出一个单位，坚守龙目海峡，为盟军关键运输单位向南撤退争取足够的时间。
MapSymbol_New1Label_cn=巴厘岛
MapSymbol_New2Label_cn=龙目岛
MapSymbol_New3Label_cn=苏联水面突袭部队
MapSymbol_New4Label_cn=？
MapSymbol_New5Label_cn=？
MapSymbol_New6Label_cn=？
MapSymbol_New7Label_cn=New Symbol
MapSymbol_New8Label_cn=龙目海峡
Taskforce2Vessel2NameOverride=激昂（BPK-725）
Taskforce2Vessel2ShortNameOverride=激昂
Trigger4Condition_Condition1AreaLabel=基准点A01
Taskforce1StartmessageMessage=Title=<size=24>出击太平洋：船只挑战1</size>\n坚守龙目海峡\n<size=24>1985年7月12日</size>\nBody=盟军正在向澳大利亚撤退。{SelectedUnitName}号已被调离原先的任务以阻止苏联突袭部队封锁龙目海峡。\n\n敌方空中单位将出动以掩护水面突袭部队，至少一艘877型潜艇疑似在此区域内活动。消灭遭遇的所有敌方水面单位和潜艇。\nButtonText=开始任务\nPopupStyle=Intro
StartmessageForecast=龙目海峡舰队天气预报\n有效期：1985年7月12日0200Z时至12日0800Z时\n东南季风将持续影响龙目海峡，夜间少云，海况为3级。预计不会出现明显降雨或雾，海峡和巴厘岛-龙目岛航道能见度良好。上午时段天气状况将保持稳定，水流加速区可能出现局部阵风。
Taskforce1SelectedunitmustsurviveMessage=Title=任务失败！\nBody=任务失败！{SelectedUnitName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1DatumA01messageMessage=From=太平洋舰队总司令\nTo={SelectedUnitName}号舰长\nInfo=\nSubj=接触报告——潜艇基准点A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）提示：截获无线电显示一艘潜艇在龙目海峡以北活动。\n\n2.（机密）基准点A01已于0130Z时在位置8.11S，115.8E建立。\n\n3.（机密）务必摧毁此接触。祝你好运，猎杀愉快。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Taskforce1DatumA01messageIntel=截获无线电显示苏联潜艇正从北方进入龙目海峡。基准点A01已被标记在你的地图上。
Taskforce1Destroyenemyships-playervictoryMessage=From=第77特遣舰队指挥官\nTo={SelectedUnitName}号舰长\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）侦察显示尝试封锁龙目海峡的苏联突袭部队主力已被消灭。\n\n2.（机密）预计包含基洛夫号的苏联海军部队可能在未来72小时内展开后续行动，但截至0300Z时，盟军的所有关键运输船均已通过海峡。\n\n3.（机密）干得漂亮。在巴厘岛附近海域停留至2200Z时，之后与{TaskForceName}会合，离开此区域并前往达尔文。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
