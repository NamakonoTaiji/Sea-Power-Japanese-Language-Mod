[Language_cn]
Name=08北婆罗洲防御战
Description=印度尼西亚的局势稳定之后，盟军在太平洋的战略重心已北移至菲律宾。位于北婆罗洲的山打根正作为前沿基地，盟军在此准备对巴拉望岛的最终攻势。敌军正在尝试对山打根发动破坏性突袭，消灭驻扎在当地的盟军部队。指挥此区域内的盟军单位击退敌方进攻。
