[Language_ru]
Name=08 Оборона Северного Борнео
Description=С обеспечением безопасности Индонезии, внимание союзников сместилось на север в сторону Филиппин. Сандакан на севере Борнео является хорошим плацдармом для возможного наступления на Палаван. Пытаясь парировать эту угрозу, противник предпринимает наступление на Сандакан. Примите командование войсками союзников в районе Сандакана и отразите атаку противника.
