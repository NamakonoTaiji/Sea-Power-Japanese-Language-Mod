Taskforce1StartMessage=Title=<size=24>出击太平洋：第8部分</size>\n北婆罗洲防御战\n<size=24>1985年9月20日</size>\nBody=敌军正在对山打根发动大规模攻击。侦察发现多支水面编队正在靠近，情报显示附近至少有一艘潜艇。消灭两支大型水面编队以确保区域安全并保护我方停泊在港口的两栖舰艇。\n\n注意：{FlagshipName}号在驶离港口时主配电盘发生跳闸。其轮机部门预计维修将花费20分钟。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=山打根舰队天气预报\n有效期：1985年9月19日2300Z时至20日0500Z时\n山打根航道上空的东风维持着多云天气和3级海况。预计在监测期间不会出现组织化降水、雾或雷暴活动，能见度总体良好，利于水面和空中行动。在此期间，预计天气状况将保持稳定，仅近海地区有局部低云。
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1VictoryMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）侦察确认攻击山打根的敌方大型水面编队已被摧毁。\n\n2.（机密）山打根仍由盟军控制，为登陆巴拉望集结的部队仍具备战斗力。敌军的破坏性攻击已经失败。\n\n3.（机密）太平洋司令部司令就此次战斗的出色表现向{TaskForceName}的全体单位表示祝贺。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1EnablepropulsionMessage=Title=任务更新\nBody=指挥官，{FlagshipName}号报告其轮机故障已修复，现在可以执行任务了！\nButtonText=收到并继续\nPopupStyle=Notification
Taskforce12minairattackwarningMessage=From=太平洋舰队总司令\nTo={TaskForceName}\nInfo=山打根航空基地\nSubj=防空警报——山打根\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）提示：截获无线电表明一支强大的敌方空袭编队正在普林塞萨港的安东尼奥·包蒂斯塔航空基地集结。\n\n2.（机密）海岸观察员报告了有战斗空中巡逻伴飞的攻击机和轰炸机编队，估计共有16至20架飞机。\n\n3.（机密）预计敌军将于0000Z时抵达山打根，袭击方向为北方。设置红色防空警报，所有战斗机紧急升空。祝你好运。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Taskforce12minairattackwarningIntel=一支大型打击编队正在普林塞萨港的安东尼奥·包蒂斯塔航空基地（山打根以北约190海里）集结。袭击方位为010，海岸观察员预计将有16至20架飞机，攻击机将有战斗机护航。预计将于0000Z时（1小时后）抵达山打根。 
Objective_DestroyEnemyForces=消灭所有敌方攻击部队
