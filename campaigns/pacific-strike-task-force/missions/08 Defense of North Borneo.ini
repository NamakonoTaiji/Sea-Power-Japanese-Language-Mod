Taskforce1StartMessage=Title=<size=24>Pacific Strike - Part 8</size>\nDEFENSE OF NORTH BORNEO\n<size=24>September 20th, 1985</size>\nBody=A large-scale enemy attack on Sandakan is underway. Recon shows multiple surface groups approaching and intel suspects at least one submarine in the vicinity. Destroy both of the large surface groups to secure the area, and defend our amphibious ships at anchor in the harbor.\n\nNote: {FlagshipName}'s main switchboard has tripped while getting underway from the harbor. Her engineering department estimates this will take 20 minutes to repair.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR SANDAKAN\nVALID: 192300Z-200500Z SEP 85\nEasterly flow over the Sandakan approaches is maintaining broken cloud cover and moderate seas at Sea State 3. No organized precipitation, fog, or thunderstorm activity is expected during the watch, and visibility should remain generally good for surface and air operations. Conditions are forecast to remain steady through the period, with only localized low cloud near the coast.
Taskforce1FlagshipmustsurviveMessage=Title=DEFEAT\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Taskforce1VictoryMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=RECON REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Recon confirms major enemy surface groups attacking Sandakan have been destroyed.\n\n2. (S) Sandakan remains in Allied hands and staging forces for the Palawan operation remain operational. Enemy spoiling attack has failed.\n\n3. (S) CINCPAC passes congratulations on excellent performance by all units {TaskForceName}. CTF 77 sends.\nButtonText=Return to mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1EnablepropulsionMessage=Title=Mission Update\nBody=Commander, {FlagshipName} reports her engine casualty has been repaired and the ship is cleared for action!\nButtonText=Acknowledge & continue\nPopupStyle=Notification
Taskforce12minairattackwarningMessage=From=CINCPACFLT\nTo={TaskForceName}\nInfo=SANDAKAN AIRBASE\nSubj=AIR RAID WARNING-SANDAKAN\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) WARNING: Radio intercepts indicate major enemy airstrike package is assembling at Antonio Bautista AB at Puerto Princesa.\n\n2. (S) Coastwatcher reports fighter CAP accompanying multiple attack and bomber elements. Estimate 16-20 aircraft total.\n\n3. (S) ETA to Sandakan area 0000Z. Raid direction NORTH. Set air warning red and scramble all fighters. Good luck. CINCPAC sends.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Taskforce12minairattackwarningIntel=Major strike package assembling at Antonio Bautista AB on Palawan Island at Puerto Princesa City, approx 190nm north of Sandakan. Raid direction will be bearing 010. Coastwatcher estimates 16-20 aircraft total, attack flights escorted by fighters. ETA to Sandakan by 0000Z (1 hour).
