Taskforce1StartMessage=Title=<size=24> Тихоокеанский Удар - Часть 8</size>\nОборона Северного Борнео\n<size=24>20 сентября 1985</size>\nBody=Противник начал масштабную атаку на Сандакан. Данные разведки указывают на приближение нескольких корабельных групп, также предполагается наличие в этом районе как минимум одной подводной лодки. Уничтожьте обе крупные КУГ, и защитите наши десантные корабли, стоящие на якоре в гавани.\n\nПримечание: во время выхода из гавани на {FlagshipName} сработала защита главного распределительного щита. По оценкам инженерной службы, на устранение неисправности потребуется 20 минут.\nButtonText=Начать миссию\nPopupStyle=Intro
StartForecast=Прогноз погоды\nАктуален: 192300Z-200500Z Сентябрь 85\nВосточный ветер на подходах к Сандакану обусловливает наличие значительной облачности и волнение моря в 3 балла. В период действия предупреждения не ожидается осадков, тумана или гроз
Taskforce1FlagshipmustsurviveMessage=Title=Поражение\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1VictoryMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Разведка подтверждает уничтожение основных надводных сил противника, атаковавших Сандакан. Уцелевшие воздушные силы противника отступают на север.\n\n2. (S) Сандакан остается в руках союзников, и силы, необходимые для операции на Палаване, остаются в строю. Атака противника, пытавшегося сорвать операцию, провалилась.\n\n3. (S) Командующий Тихоокеанским командованием передает благодарность за отличную работу!\nButtonText=Вернуться к миссии\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1EnablepropulsionMessage=Title=Сообщение\nBody=Командующий, {FlagshipName} сообщает, что неполадка устранена, и корабль снова в строю!\nButtonText=Очень хорошо...\nPopupStyle=Notification
Taskforce12minairattackwarningMessage=From=Ком. Тихоокеанским флотом США\nTo={TaskForceName}\nInfo=Аэропорт Сандакан\nSubj=Предупреждение об авианалёте\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) ПРЕДУПРЕЖДЕНИЕ: Радиоперехваты указывают на то, что на авиабазе Антонио Баутиста в Пуэрто-Принсесе формируется крупная ударная группа.\n\n2. (S)  Предполагаемое количество самолетов: 16-20.\n\n3. (S) Ориентировочное время прибытия в район Сандакана: через час. Направление налета: СЕВЕР. Установить красный уровень предупреждения о воздушном нападении и поднять в воздух все истребители.\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce12minairattackwarningIntel=На авиабазе Антонио Баутиста на острове Палаван, в городе Пуэрто-Принсеса, примерно в 190 морских милях к северу от Сандакана, формируется группа крупных ударных самолетов. Направление атаки – пеленг 010. По оценкам разведки, будет задействовано 16-20 самолетов, штурмовые вылеты будут сопровождаться истребителями. Ориентировочное время прибытия в Сандакан – через 1 час.
Objective_DestroyEnemyForces=Уничтожить все атакующие силы противника
