Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――第8部</size>\n北ボルネオ防衛\n<size=24>1985年9月20日</size>\nBody=サンダカンに対する敵の大規模攻撃が始まった。偵察では複数の水上部隊の接近を確認し、情報部は付近に少なくとも1隻の潜水艦がいるとみている。大型水上部隊2群をともに撃滅して海域を確保し、港内に錨泊する我が方の揚陸艦を守れ。\n\n注記：{FlagshipName}は出港時に主配電盤の遮断が発生した。機関部は修理に20分かかると見込んでいる。\nButtonText=作戦開始\nPopupStyle=Intro
StartForecast=サンダカン海域艦隊気象予報\n予報期間：85年9月19日2300Z～20日0500Z\nサンダカンへの接近海域では東風により雲が所々に広がり、海況はシーステート3と比較的穏やかである。観測期間中、まとまった降水、霧、雷雨は予想されず、水上・航空作戦の視程は概ね良好。沿岸付近に局地的な低い雲が見られる程度で、期間を通じて気象条件に大きな変化はない見込み。
Taskforce1FlagshipmustsurviveMessage=Title=作戦失敗\nBody=敗北！{FlagshipName}が撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Taskforce1VictoryMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官　パールハーバー、ハワイ州\nSubj=偵察報告――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 偵察により、サンダカンを攻撃した敵の主力水上部隊の撃滅を確認した。\n\n2. (S) サンダカンは引き続き同盟軍の手にあり、パラワン島作戦に向けて集結中の部隊も作戦可能な状態を保っている。敵の妨害攻撃は失敗した。\n\n3. (S) 太平洋軍司令官から、{TaskForceName}の全所属部隊の見事な働きに祝意が伝えられた。第77任務部隊指揮官より。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1EnablepropulsionMessage=Title=作戦状況更新\nBody=指揮官、{FlagshipName}の機関の不具合は修理され、戦闘行動が可能になった！\nButtonText=了解して続行\nPopupStyle=Notification
Taskforce12minairattackwarningMessage=From=太平洋艦隊司令長官（CINCPACFLT）\nTo={TaskForceName}\nInfo=サンダカン飛行場\nSubj=航空襲撃警報――サンダカン\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 警告：無線傍受によると、プエルト・プリンセサのアントニオ・バウティスタ空軍基地で敵の大規模攻撃航空隊が集結中である。\n\n2. (S) 沿岸監視員によれば、複数の攻撃機・爆撃機部隊に戦闘機の空中哨戒が随伴している。総数は16～20機と推定される。\n\n3. (S) サンダカン付近への到着予定は0000Z。来襲方向は北。防空警報を赤に引き上げ、全戦闘機を緊急発進させよ。健闘を祈る。太平洋軍司令官より。\nButtonText=了解して続行\nPopupStyle=NavalMessage
Taskforce12minairattackwarningIntel=パラワン島プエルト・プリンセサ市のアントニオ・バウティスタ空軍基地（サンダカンの北方約190海里）で、敵の大規模攻撃航空隊が集結中。来襲方位は010度。沿岸監視員は、戦闘機に護衛された攻撃機隊を含め総数16～20機と推定。0000Z（約1時間後）までにサンダカンへ到達する見込み。
Objective_DestroyEnemyForces=来襲するすべての敵戦力の撃滅
Objective_FlagshipMustSurvive={FlagshipName}の生存
