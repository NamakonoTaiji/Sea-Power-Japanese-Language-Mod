Taskforce1StartMessage=Title=<size=24>Pacific Strike - Teil 8</size>\nVERTEIDIGUNG NORDBORNEOS\n<size=24>20. September 1985</size>\nBody=Ein großangelegter feindlicher Angriff auf Sandakan ist im Gange. Die Aufklärung zeigt mehrere anrückende Kampfverbände und der Nachrichtendienst vermutet mindestens ein U-Boot in der Nähe. Zerstören Sie beide Kampfverbände, um den Einsatzraum zu sichern und verteidigen Sie unsere amphibischen Schiffe, die im Hafen vor Anker liegen.\n\nHinweis: Beim Auslaufen aus dem Hafen ist die Hauptschalttafel von {FlagshipName} ausgefallen. Der Maschinenraum schätzt, dass die Reparatur 20 Minuten dauern wird.\nButtonText=Mission starten\nPopupStyle=Intro
StartForecast=FLOTTEN-WETTERVORHERSAGE FÜR SANDAKAN\nGÜLTIG: 200300Z-200900Z AUG 85\nEin sich entwickelndes Tiefdruckgebiet östlich von Sandakan sorgt für zunehmende Winde und einen zunehmenden Seegang. Die Bedingungen werden sich in den nächsten Stunden voraussichtlich rasch verschlechtern. Die aufgelockerte Bewölkung um 0300Z wird bis 0500Z in bedeckten Himmel übergehen, während feuchte tropische Luft in die Region einströmt. Nach 0500Z setzen Regenschauer und eingeschränkte Sicht ein, während der Seegang die Stufe 4 überschreiten wird.
Taskforce1FlagshipmustsurviveMessage=Title=NIEDERLAGE\nBody=Niederlage! {FlagshipName} wurde versenkt!\nButtonText=Zurück zur Mission\nPopupStyle=Outro
Taskforce1VictoryMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=AUFKLÄRUNGSMELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Aufklärung bestätigt, dass die feindlichen Hauptkampfgruppen beim Angriff auf Sandakan zerstört wurden. Verbleibende feindliche Luftkräfte ziehen nach Norden ab.\n\n2. (S) Sandakan bleibt in alliierter Hand und die Kräfte für die Operation Palawan bleiben einsatzbereit. Der feindliche Störangriff ist gescheitert.\n\n3. (S) Sie haben die Tür offen gehalten, Kommandant. Stellen Sie die örtliche Luftverteidigung wieder her, versorgen Sie Ihre Schiffe und bereiten Sie sich auf Operation CHALLENGER vor. CTF 77 Ende.\nButtonText=Zurück zur Mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce12minairattackwarningMessage=From=CINCPACFLT\nTo={TaskForceName}\nInfo=SANDAKAN AIRBASE\nSubj=LUFTANGRIFFSWARNUNG - SANDAKAN\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) WARNUNG: Funkaufklärung deutet darauf hin, dass sich ein größerer Angriffsverband auf der Antonio Bautista Air Base bei Puerto Princesa formiert.\n\n2. (S) Ein Beobachter in Küstennähe berichtet, dass mehrere Angriffs- und Bomberverbände von Jagdflugzeugen eskortiert werden. Geschätzte Gesamtstärke: 16 bis 20 Luftfahrzeuge.\n\n3. (S) ETA im Raum Sandakan 0000Z. Angriffsrichtung NORD. Rufen Sie Luftwarnstufe Rot aus und befehlen Sie allen Abfängjägern den Alarmstart. Viel Glück. CINCPAC Ende.\nButtonText=Bestätigen und fortfahren\nPopupStyle=NavalMessage
Taskforce12minairattackwarningIntel=Größerer Angriffsverband formiert sich auf der Antonio Bautista Air Base auf der Insel Palawan bei Puerto Princesa City, ca. 190 sm nördlich von Sandakan. Angriffsrichtung wird Peilung 010 sein. Beobachter schätzt insgesamt 16 bis 20 Luftfahrzeuge, Angriffs- und Bomberverbände mit Jagdflugzeugen. ETA Sandakan bis 0000Z (1 Stunde).
