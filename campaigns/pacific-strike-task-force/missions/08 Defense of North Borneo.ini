[Language_ja]
Name=08 北ボルネオ防衛
Description=インドネシアの安全が確保され、太平洋における同盟軍の作戦計画はフィリピン方面へと移った。ボルネオ島北部のサンダカンは、今後のパラワン島強襲に向けた前進拠点となっている。敵はそこに集結する同盟軍戦力を破壊し、攻勢を妨げるため、サンダカンへの急襲を企てている。周辺の同盟軍部隊を指揮し、敵の攻撃を撃退せよ。
