Taskforce1StartmessageMessage=Title=<size=24>Pacific Strike - Teil 5</size>\nANGRIFF AUF DAS MONSTER\n<size=24>10. August 1985</size>\nBody=Der Kirov-Kampfverband bewegt sich aus dem Indischen Ozean nach Osten in Richtung Australien. Nutzen Sie sämtliche verfügbaren alliierten Marinekräfte im Einsatzraum, um die Kirov und ihre Begleitschiffe aufzuklären und zu vernichten.\n\nEinige wenige alliierte Luftstreitkräfte sind auf Broome Field in Westaustralien stationiert.\nButtonText=Mission starten\nPopupStyle=Intro
StartmessageForecast=FLOTTEN-WETTERVORHERSAGE FÜR DEN SEE- UND KÜSTENRAUM VOR BROOME\nGÜLTIG: 102100Z-110300Z AUG 85\nÜber dem seewärtigen Bereich nördlich von Broome und im Einsatzraum des östlichen Indischen Ozeans kommt es zu Gewittertätigkeit. Bedeckter Himmel und Winde aus Norden bringen instabile tropische Luft nach Süden. Die See ist mäßig bei einem Seegang der Stufe 3, doch in konvektiven Zellen ist mit stark eingeschränkter Sicht, böigen Winden und heftigem Regen in Gewitternähe zu rechnen. Die Gewitter werden voraussichtlich nach 0100Z nachlassen, während die Gewitterlinie ostwärts zieht. Zurück bleibt ein bedeckter Himmel mit zunehmend besserer Sicht.
Taskforce1DestroyKirovgroup-playerwinMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=AUFKLÄRUNGSMELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Aufklärung bestätigt, dass der Verband um die KIROV brennt oder manövrierunfähig im Wasser liegt.\n\n2. (S) Ihr erfolgreicher Schlag gegen diesen feindlichen Verband beseitigt die wichtigste sowjetische Bedrohung in der Region. Die alliierte Aufklärung bewertet dies als schwere Niederlage für den Feind.\n\n3. (S) Hervorragende Arbeit, Kommandant. Bergen Sie, soweit möglich, Überlebende und kehren Sie zur Versorgung nach Darwin zurück. CTF 77 Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! {FlagshipName} wurde versenkt!\nButtonText=Weiterspielen\nPopupStyle=Outro
Objective_DestroyKirovSAG=Zerstören Sie die Kirov-SAG
