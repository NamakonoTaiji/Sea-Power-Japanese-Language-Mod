Taskforce1StartmessageMessage=Title=<size=24>パシフィック・ストライク――第5部</size>\n巨獣への一撃\n<size=24>1985年8月10日</size>\nBody=キーロフ水上戦闘群はインド洋からオーストラリアへ向けて東進中である。戦域内の同盟軍海軍戦力を総動員し、キーロフとその護衛艦を捜索・撃沈せよ。\n\n西オーストラリアのブルーム飛行場には、限定的な同盟軍航空戦力が展開している。\n\n注記：任務部隊は悪天候に乗じてキーロフ水上戦闘群に接近し、協同ミサイル攻撃を行える位置にいる。敵による識別を困難にするため、陣形は分散している。電波管制（EMCON）を維持し、敵に探知されるな。敵の航空偵察を警戒する戦闘空中哨戒（CAP）には、レーダーを使用させよ。\nButtonText=作戦開始\nPopupStyle=Intro
StartmessageForecast=ブルーム沖合海域艦隊気象予報\n予報期間：85年8月10日2100Z～11日0300Z\nブルーム北方の沖合接近経路と東インド洋の作戦海域では雷雨が発生している。空は雲に覆われ、北風が不安定な熱帯気流を南へ運んでいる。波浪は海象状態3（シーステート3）と比較的穏やかだが、雷雨域内では雷光、突風前線、低い雲によって視程が大きく低下する。雷雨帯が東へ移動するため、2100Zを少し過ぎると雷雨は弱まり、曇天が続くものの視程は改善する見込み。
Taskforce1DestroyKirovgroup-playerwinMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官　パールハーバー、ハワイ州\nSubj=偵察報告――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 偵察により、キーロフ戦闘群の炎上または航行不能を確認した。\n\n2. (S) 貴部隊による攻撃の成功で、この地域におけるソ連の主要な水上脅威は排除された。同盟軍情報部は、これを敵の重大な敗北と評価している。\n\n3. (S) 見事な働きだ、指揮官。可能な限り生存者を救助し、補給のためダーウィンへ帰投せよ。第77任務部隊指揮官より。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=任務失敗\nBody=敗北！{FlagshipName}が撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Objective_DestroyKirovSAG=キーロフ水上戦闘群の撃滅
