[Language_ru]
Name=05 Охота на монстра
Description=После отступления союзных войск к Австралии противник пытается воспользоваться своим преимуществом, отправив в Индийский океан мощную эскадру, центром которой является тяжёлый крейсер «Киров». Это соединение было обнаружено прошлой ночью в Ломбокском проливе и, вероятно, движется на восток, для ведения боевых действий возле Австралии. Используйте все доступные силы союзников, находящиеся на этом театре военных действий, чтобы найти и потопить «Киров» и его эскорт.
