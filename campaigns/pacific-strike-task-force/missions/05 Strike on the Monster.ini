[Language_ja]
Name=05 巨獣への一撃
Description=同盟軍がオーストラリアまで押し戻された今、敵は優勢に乗じて巡洋戦艦キーロフを中核とする強力な襲撃部隊をインド洋へ送り込んだ。同部隊は昨夜ロンボク海峡を通過するところを探知され、オーストラリアを脅かすべく東進しているとみられる。戦域内の同盟軍海軍戦力を総動員し、キーロフとその護衛艦を捜索・撃沈せよ。
