Taskforce1StartmessageMessage=Title=<size=24>Pacific Strike - Part 5</size>\nSTRIKE ON THE MONSTER\n<size=24>August 10th, 1985</size>\nBody=The Kirov surface group is moving east from the Indian Ocean towards Australia. Make use of every Allied naval asset in theater to find and sink the Kirov and her escorts.\n\nLimited Allied air assets are stationed at Broome Field in Western Australia.\n\nNote: The Task Force has closed with the Kirov SAG under heavy weather for a coordinated missile strike. The formation is dispersed to complicate enemy classification. Remain on EMCON and undetected. Fighter CAP must use radar to screen for enemy air recon.\nButtonText=Start mission\nPopupStyle=Intro
StartmessageForecast=FLEET WEATHER FORECAST FOR BROOME OFFSHORE AREA\nVALID: 102100Z-110300Z AUG 85\nThunderstorm activity is present over the offshore approaches north of Broome and the eastern Indian Ocean operating area, with overcast skies and northerly winds feeding unstable tropical air southward. Seas are moderate at Sea State 3, but visibility will be sharply reduced inside storm cells by lightning, gust fronts, and low cloud. Thunderstorms are expected to weaken shortly after 2100Z as the cell line moves east, leaving overcast conditions and improving visibility.
Taskforce1DestroyKirovgroup-playerwinMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nSubj=RECON REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Recon confirms the KIROV group burning or dead in the water.\n\n2. (S) Your succesful strike on this enemy force removes the principal Soviet surface threat in the region. Allied intel assesses this as a major defeat for the enemy.\n\n3. (S) Outstanding work, Commander. Recover survivors where practicable and return to Darwin for replenishment. CTF 77 sends.\nButtonText=Return to mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Objective_DestroyKirovSAG=Destroy the Kirov SAG
Objective_FlagshipMustSurvive={FlagshipName} must survive
[Language_cn]
Name=05猎杀巨兽
Description=盟军已被击退至澳大利亚，敌军尝试派遣以基洛夫号战列巡洋舰为核心的强大突袭部队进入印度洋，以此扩大优势。昨夜侦察发现此部队正在通过龙目海峡，目前很可能正在向东移动以威胁澳大利亚。利用战区内的所有盟军海上资产找到并击沉基洛夫号及其护航舰艇。
