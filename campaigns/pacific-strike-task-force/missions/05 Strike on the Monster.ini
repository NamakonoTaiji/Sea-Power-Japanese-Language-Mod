Taskforce1StartmessageMessage=Title=<size=24>Тихоокеанский Удар - Часть 5</size>\nОхота на монстра\n<size=24>Август 10-е, 1985</size>\nBody=Ударная группа «Киров» движется на восток из Индийского океана в сторону Австралии. Используйте все доступные силы союзников, находящиеся на этом театре военных действий, чтобы найти и потопить «Киров» и его эскорт.\n\nОграниченные силы авиации союзников размещены на аэродроме Брум в Западной Австралии.\nButtonText=Начать миссию\nPopupStyle=Intro
StartmessageForecast=Прогноз погоды для зоны к северо-западу от Брума\nАктуален: 102100Z-110300Z Август 85\nВ акватории к северу от Брума и в восточной части Индийского океана наблюдается грозовая активность. Сплошная облачность, ветер северный, умеренный. Волнение моря оценивается в 3 балла, однако видимость будет резко снижена из-за сильных ливней и гроз. Ожидается, что после 21:00 UTC грозы ослабнут, при этом сохранится сплошная облачность.
Taskforce1DestroyKirovgroup-playerwinMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Разведка подтверждает, что КУГ «Киров» полностью уничтожена.\n\n2. (S) Вам удалось устранить главную советскую надводную угрозу в регионе. Наша разведка оценивает это как крупное поражение противника.\n\n 3. (S) Отличная работа, командир! Организуйте поиск и спасение выживших, если это возможно, и возвращайтесь в Дарвин для пополнения боекомплекта и ремонта.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Objective_DestroyKirovSAG=Уничтожить «Киров» и его группу
