Taskforce1StartmessageMessage=Title=<size=24>出击太平洋：第5部分</size>\n猎杀巨兽\n<size=24>1985年8月10日</size>\nBody=基洛夫号水面行动群正从印度洋向东开往澳大利亚。利用战区内的所有盟军海上资产找到并击沉基洛夫号及其护航舰艇。\n\n西澳大利亚的布鲁姆机场部署了有限的盟军空中资产。\n\n注意：特遣舰队已在恶劣天气下接近了基洛夫号水面行动群，准备进行协同导弹打击。编队保持分散以提高敌方识别难度。舰艇保持辐射控制和隐蔽状态。战斗空中巡逻必须使用雷达，防止舰艇暴露在敌方空中侦察之下。\nButtonText=开始任务\nPopupStyle=Intro
StartmessageForecast=布鲁姆近海区域舰队天气预报\n有效期：1985年8月10日2100Z时至11日0300Z时\n布鲁姆以北的沿海航道和东印度洋的行动区域上空存在雷暴活动，天空被云层遮蔽，北风将不稳定的热带空气送往南方。海况为3级，但雷电、阵风锋和低云将导致风暴内部能见度急剧下降。预计随着风暴线东移，雷暴将在2100Z时后不久减弱，天气转为阴天，能见度提高。
Taskforce1DestroyKirovgroup-playerwinMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）侦察确认基洛夫号水面行动群的船只已全部起火或沉没。\n\n2.（机密）你们成功打击了这支敌军，消除了苏军对此地区构成的重大水面威胁。盟军情报部门评估认为这是敌军的一次惨败。\n\n3.（机密）干得漂亮，指挥官。尽可能营救幸存者，再返回达尔文进行补给。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Objective_DestroyKirovSAG=摧毁基洛夫号水面行动群
