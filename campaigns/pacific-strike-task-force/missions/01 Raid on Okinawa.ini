[Language_cn]
Name=01冲绳岛突袭
Description=战事已于今日上午在欧洲和太平洋爆发，盟军情报显示苏联正在尝试对冲绳发动一次大胆的突袭。此突击队已登上悬挂日本国旗的汽车运输船并抵达冲绳附近。一支由中国海军水面舰艇组成的打击部队正从西北方向接近，为苏军提供支援。立即出发，在敌人抵达冲绳之前将其消灭。
