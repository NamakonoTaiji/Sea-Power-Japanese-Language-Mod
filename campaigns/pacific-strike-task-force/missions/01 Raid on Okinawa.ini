[Language_ja]
Name=01 沖縄強襲
Description=本日朝、欧州および太平洋で戦端が開かれた。同盟軍情報部は、ソ連軍が沖縄への大胆な特殊部隊襲撃を企図していることを察知した。日本船籍の自動車運搬船に乗り込んだ特殊部隊は、すでに沖縄の島影を望む位置まで接近している。北西から接近する中国海軍（PLAN）の水上打撃部隊がこれを支援している。直ちに出撃し、敵攻撃部隊が沖縄へ到達する前に撃滅せよ。
