Taskforce1StartMessage=Title=<size=24>出击太平洋：第1部分</size>\n冲绳岛突袭\n<size=24>1985年6月26日</size>\nBody=苏联尝试抢占先机，对冲绳岛发动了突袭。一支突击队登上了一艘征用的商船，其北方有水面行动群提供支援。从那霸向西航行，在敌军登岛之前将其消灭。\n\n美国空军的E-3A“暗星”预警机已在嘉手纳航空基地上空执行对空和对海侦察任务，日本海上自卫队的P-3已在冲绳西南巡逻。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=冲绳区域舰队天气预报\n有效期：1985年6月26日2030Z时至27日0230Z时\n夜间，琉球群岛中部上空的微弱西风不会影响冲绳及那霸以西海域的多云天气。海况预计维持在3级，无组织化降水或雾。能见度总体良好，利于水面和空中行动，但低空云层可能间歇性遮蔽较高地形和沿海航道。
