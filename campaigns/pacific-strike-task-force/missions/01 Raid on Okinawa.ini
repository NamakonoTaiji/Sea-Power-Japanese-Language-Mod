Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――第1部</size>\n沖縄強襲\n<size=24>1985年6月26日</size>\nBody=主導権を奪取せんと、ソ連軍による沖縄急襲が始まっている。特殊部隊は徴用された商船に乗船し、北方の水上戦闘群の支援を受けている。那覇から西進し、敵部隊が沖縄へ到達する前に撃滅せよ。\n\n米空軍のE-3A「ダークスター」が嘉手納空軍基地上空に展開し、航空・水上の状況把握を支援している。海上自衛隊のP-3は沖縄南西沖を哨戒中である。\nButtonText=ミッション開始\nPopupStyle=Intro
StartForecast=沖縄海域艦隊気象予報\n有効期間：85年6月26日2030Z～27日0230Z\n琉球諸島中部では弱い西風が吹き、夕刻を通じて沖縄と那覇西方海域は雲量の多い状態が続く。海況は3のまま推移し、まとまった降水や霧は予想されない。水上・航空作戦に必要な視程は概ね良好だが、低い雲が高地や沿岸への進入経路を一時的に覆う可能性がある。
Taskforce1FlagshipmustsurviveMessage=Title=作戦失敗\nBody=敗北！ {FlagshipName}が撃沈された！\nButtonText=プレイを続ける\nPopupStyle=Outro
Taskforce1AssaultunitreachesKume-playerdefeatMessage=Title=作戦失敗\nBody=敗北！ 敵特殊部隊が久米島に上陸した！\nButtonText=プレイを続ける\nPopupStyle=Outro
Taskforce1Enemyunitsdestroyed-playervictoryMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官（ハワイ州パールハーバー）\n太平洋空軍司令官（ハワイ州ヒッカム空軍基地）\n在日米軍司令官（横田基地、日本）\nSubj=偵察報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 偵察により、敵襲撃部隊が沈没または炎上中であることを確認した。司令部は、沖縄に対する敵の進撃を完全に阻止したと判断する。\n\n2. (S) 情報部は、これが好機に乗じた襲撃であり、短期的に沖縄に対するさらなる攻撃が行われる可能性は低いとみている。\n\n3. (S) 見事な働きだ、指揮官。弾薬と燃料の緊急補給のため那覇へ帰投せよ。後続作戦が間近に迫っている。第77任務部隊指揮官より。\nButtonText=プレイを続ける\nPopupStyle=NavalMessage\nMessageRole=Outro
