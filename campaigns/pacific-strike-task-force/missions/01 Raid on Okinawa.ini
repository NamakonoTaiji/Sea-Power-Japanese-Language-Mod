Taskforce1StartMessage=Title=<size=24>Тихоокеанский Удар - Часть 1</size>\nРейд на Окинаву\n<size=24>26 июня 1985</size>\nBody=Советский Союз предпринимает дерзкую попытку провести рейд на Окинаве. Подразделения спецназа на борту ролкера, идущего под японским флагом, уже находятся в пределах видимости островов. Их прикрывают надвигающиеся с северо-запада силы ВМФ НОАК. Выдвигайтесь на перехват и отразите атаку, прежде чем силы противника достигнут Окинавы.\n\nE-3A «Даркстар» ВВС США с авиабазы Кадена обеспечит обнаружение целей, также вам придан самолёт Сил Самообороны Японии P-3 «Орион» находящийся в патруле к юго-западу от Окинавы.\nButtonText=Начать миссию\nPopupStyle=Intro
StartForecast=Прогноз погоды для района Окинавы\nАктуален: 262030Z-270230Z июнь 85\nСлабый западный ветер над центральной частью архипелага Рюкю обусловит переменную облачность над Окинавой и акваторией к западу от Нахи в течение вечера. Ожидается, умеренное волнение моря (3 балла)
Taskforce1FlagshipmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1AssaultunitreachesKume-playerdefeatMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! Вражеский спецназ высадился на Кумедзиме!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1Enemyunitsdestroyed-playervictoryMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nКом. ВМС США в Японии, Авиабаза Йокота\nSubj=Доклад - Миссия выполнена\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Разведка подтверждает что все силы противника уничтожены\n\n2. (S) Командование полагает, что это был оппортунистический рейд, и дальнейшие боевые действия против Окинавы маловероятны в ближайшей перспективе.\n\n3. (S) Отличная работа, командир. Возвращайтесь в Наху для загрузки боеприпасов и дозаправки.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
