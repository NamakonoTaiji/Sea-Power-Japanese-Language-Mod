Taskforce1Enemyunitsdestroyed-playervictoryMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\n夏威夷州希卡姆空军基地太平洋空军总司令\n日本横田空军基地美国驻日本部队司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）侦察显示敌方突袭部队正在燃烧和下沉，指挥部评估敌军对冲绳的攻势已无法进行。\n\n2.（机密）情报评估认为这是一次机会主义的冒险突袭，敌方短期内不太可能对冲绳采取进一步行动。\n\n3.（机密）指挥官，干得漂亮！返回那霸，抓紧时间补充弹药和燃料。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
