Taskforce1StartMessage=Title=<size=24>Pacific Strike - Part 1</size>\nRAID ON OKINAWA\n<size=24>June 26th, 1985</size>\nBody=Attempting to seize the initiative, a Soviet raid on Okinawa is underway. A commando force is embarked aboard a commandeered merchant supported by a surface action group to the north. Proceed west from Naha and destroy the incoming enemy forces before they reach the island.\n\nUSAF E-3A "Darkstar" is on station over Kadena AFB for air and surface picture, and JMSDF P-3 is on patrol SW of Okinawa.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR OKINAWA AREA\nVALID: 262030Z-270230Z JUN 85\nA weak westerly flow over the central Ryukyus will maintain broken cloud cover across Okinawa and the waters west of Naha through the evening period. Seas are expected to remain moderate at Sea State 3, with no organized precipitation or fog forecast. Visibility should remain generally good for surface and air operations, though low cloud decks may intermittently obscure higher terrain and coastal approaches.
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1AssaultunitreachesKume-playerdefeatMessage=Title=MISSION FAILED\nBody=Defeat! The enemy commando force has landed on Kumejima!\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1Enemyunitsdestroyed-playervictoryMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nCINCPACAF HICKAM AFB HI\nCOMUSJAPAN YOKOTA AB JA\nSubj=RECON REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Recon shows enemy raiding force sinking or burning and command assesses enemy push at Okinawa has been stopped in its tracks.\n\n2. (S) Intel believes this was an opportunistic raid and further action against Okinawa is unlikely in near term.\n\n3. (S) Excellent work, Commander. Return to Naha for expedited ammo load and refuel. Follow on operations are imminent. CTF 77 sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
