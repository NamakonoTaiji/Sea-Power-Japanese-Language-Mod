Taskforce1StartMessage=Title=<size=24>Pacific Strike - Teil 1</size>\nANGRIFF AUF OKINAWA\n<size=24>26. Juni 1985</size>\nBody=Um die Initiative zu ergreifen, läuft ein sowjetischer Angriff auf Okinawa. Eine Kommandoeinheit befindet sich an Bord eines requirierten Handelsschiffs und wird von einer Kampfgruppe (SAG) aus Norden unterstützt. Verlegen Sie von Naha nach Westen und zerstören Sie die anrückenden feindlichen Kräfte, bevor sie die Insel erreichen.\n\nUSAF E-3A „Darkstar“ befindet sich über der Kadena AFB auf Station und liefert ein Luft- und Oberflächenlagebild. Eine JMSDF P-3 patrouilliert südwestlich von Okinawa.\nButtonText=Mission starten\nPopupStyle=Intro
StartForecast=FLOTTEN-WETTERVORHERSAGE FÜR DEN RAUM OKINAWA\nGÜLTIG: 262030Z-270230Z JUN 85\nEine schwache westliche Brise über den zentralen Ryūkyū-Inseln sorgt im Verlauf des Abends für aufgelockerte bis starke Bewölkung über Okinawa und den Gewässern westlich von Naha. Die See bleibt voraussichtlich mäßig bei einem Seegang der Stufe 3, Niederschlag oder Nebel werden nicht erwartet. Die Sicht sollte für See- und Luftoperationen ausreichend sein, auch wenn niedrige Wolkendecken zeitweise höheres Gelände und Küstenanflüge verdecken können.
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! {FlagshipName} wurde versenkt!\nButtonText=Weiterspielen\nPopupStyle=Outro
Taskforce1AssaultunitreachesKume-playerdefeatMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! Die feindliche Kommandoeinheit ist auf Kumejima gelandet!\nButtonText=Weiterspielen\nPopupStyle=Outro
Taskforce1Enemyunitsdestroyed-playervictoryMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nCINCPACAF HICKAM AFB HI\nCOMUSJAPAN YOKOTA AB JA\nSubj=AUFKLÄRUNGSMELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Aufklärung zeigt, dass der feindliche Angriffsverband sinkt oder brennt. Die Führung bewertet den feindlichen Vorstoß auf Okinawa als gescheitert.\n\n2. (S) Der Nachrichtendienst geht davon aus, dass es sich um einen opportunistischen Angriff handelte und weitere Operationen gegen Okinawa kurzfristig unwahrscheinlich sind.\n\n3. (S) Ausgezeichnete Arbeit, Kommandant. Kehren Sie zum Tanken und Aufmunitionieren nach Naha zurück. Folgeoperationen stehen unmittelbar bevor. CTF 77 Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
