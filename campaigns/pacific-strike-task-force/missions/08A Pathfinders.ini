Taskforce1StartMessage=Title=<size=24>出击太平洋：潜艇挑战3</size>\n探路者\n<size=24>1985年9月20日</size>\nBody=俄里翁号潜艇已收到命令侦察巴拉望岛普林塞萨港的敌方基地航道。隐蔽地靠近，使用潜望镜或电子支援措施桅杆识别岸上设施，完成侦察后向东撤退。\n\n允许与区域内的敌军交战，但你的首要任务是侦察。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=普林塞萨港航道舰队天气预报\n有效期：1985年9月20日2000Z时至21日0200Z时\n巴拉望岛西部上空的东风使云量维持在少云，海况为3级。预计不会出现组织化降水、雾或雷暴活动。夜间能见度总体良好，但沿海地区的霾和低云可能会短暂影响潜望镜的近岸观察。
Taskforce1HMASOrionmustsurviveMessage=Title=任务失败！\nBody=任务失败！俄里翁号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=海军总部\nTo=俄里翁号潜艇\nInfo=鸭嘴兽海军基地\n夏威夷州珍珠港太平洋舰队总司令\n太平洋潜艇部队司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1.（机密）已确认收到来自普林塞萨港航道的侦察报告。\n\n2.（机密）已识别的海岸导弹阵地和相关岸上设施信息将发送给第77特遣舰队和登陆部队指挥官，用于制定打击计划。\n\n3.（机密）向东航行，保持隐蔽。太平洋潜艇部队司令期待俄里翁号悬挂着象征任务完成的扫帚返回达尔文港。干得漂亮，俄里翁号。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1IdentifyshoreinstallationsMessage=Title=任务更新\nBody=指挥官，我们已经成功识别了敌方主要设施，现在可以向东撤离。大致的安全区域已标记在我们的海图上。\nButtonText=收到并继续\nPopupStyle=Notification
