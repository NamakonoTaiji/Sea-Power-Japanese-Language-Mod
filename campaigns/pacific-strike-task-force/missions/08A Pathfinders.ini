Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――潜水艦チャレンジ3</size>\nパスファインダー\n<size=24>1985年9月20日</size>\nBody=HMASオリオンは、パラワン島プエルト・プリンセサ市の敵基地への接近海域を偵察せよ。探知されずに接近し、潜望鏡または電子支援装置（ESM）マストで沿岸施設を識別した後、偵察を終えたら東方へ離脱せよ。\n\n周辺の敵部隊との交戦は許可するが、最優先は偵察である。\nButtonText=作戦開始\nPopupStyle=Intro
StartForecast=プエルト・プリンセサ接近海域艦隊気象予報\n予報期間：85年9月20日2000Z～21日0200Z\nパラワン島西部では東風により雲が所々に広がり、海況はシーステート3と比較的穏やか。まとまった降水、霧、雷雨は予想されない。夜間を通じて視程は概ね良好だが、沿岸のもやと低い雲により、海岸近くでは一時的に潜望鏡による観測が妨げられる可能性がある。
Taskforce1HMASOrionmustsurviveMessage=Title=作戦失敗\nBody=敗北！HMASオリオンが撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=海上総司令部\nTo=HMASオリオン\nInfo=HMASプラティパス\n太平洋艦隊司令長官　パールハーバー、ハワイ州\n太平洋艦隊潜水艦部隊司令官（COMSUBPAC）\nSubj=偵察報告――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1. (S) プエルト・プリンセサ接近海域からの偵察報告を受領した。\n\n2. (S) 識別した沿岸ミサイル陣地と関連施設の情報は、攻撃計画のため第77任務部隊と揚陸部隊の指揮官へ伝える。\n\n3. (S) 東方へ離脱し、探知されるな。太平洋艦隊潜水艦部隊司令官は、任務完遂を示す箒を掲げてオリオンがダーウィンに帰投することを期待している。見事だ、オリオン。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1IdentifyshoreinstallationsMessage=Title=作戦状況更新\nBody=指揮官、敵の主要施設の識別に成功した。これより東方へ離脱できる。安全とみられる海域の概略は海図に示してある。\nButtonText=了解して続行\nPopupStyle=Notification
