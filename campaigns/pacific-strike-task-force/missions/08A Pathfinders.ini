Taskforce1StartMessage=Title=<size=24>Дополнительная миссия</size>\Разведчик\n<size=24>20 сентября 1985</size>\nBody=HMAS «Орион» приказано разведать подходы к вражеской базе в городе Пуэрто-Принсеса на острове Палаван. Подойдите незамеченными, обнаружьте береговые установки ЗУР и ПКР, а затем отходите на восток, как только разведка будет завершена.\n\nВы можете свободно атаковать вражеские цели в этом районе, но ваша главная задача - разведка.\nButtonText=Начать миссию\nPopupStyle=Intro
StartForecast=Прогноз погоды в районе города Пуэрто-Принсеса\nАктуален: 202000Z-210200Z Сентябрь 85\nВосточный ветер над западной частью Палавана вызывает малую облачность и умеренное волнение моря силой 3 балла. Организованные осадки, туман и грозовая активность не ожидаются. В течение ночи видимость в целом должна оставаться хорошей, хотя прибрежная дымка и низкие облака могут кратковременно осложнять наблюдение в перископ у берега.
Taskforce1HMASOrionmustsurviveMessage=Title=Поражение\nBody=Поражение! HMAS «Орион» была потоплена!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=Морской штаб\nTo=HMAS «Орион»\nInfo=HMAS «Платипус»\nКом. Тихоокеанским флотом США, Пёрл-Харбор\nКом. подв. силами США на Тихом Океане\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1. (S) Подтверждено получение разведданных по подходам к Пуэрто-Принсесе.\n\n2. (S) Информация о местоположении идентифицированных береговых оборонительных сооружений и связанной с ними инфраструктуры будет передана командующим оперативной группой 77 и десантными силами.\n\n3. (S) Отходите на восток и оставайтесь незамеченными. Благодарим за отличную работу!\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1IdentifyshoreinstallationsMessage=Title=ЗАДАЧА ВЫПОЛНЕНА\nBody=Командир, мы успешно обнаружили и нанесли на карту основные вражеские оборонительные сооружения, и теперь можем отходить на восток. Зона отхода отмечена на карте.\nButtonText=Продолжить\nPopupStyle=Notification
Objective_ReconInstallations=Разведать все ЗРК и береговые батареи ПКР возле города
Objective_OrionMustSurvive=HMAS «Орион» должен выжить
Objective_ReachMarkedArea=Достигните отмеченной области, чтобы покинуть миссию
