Taskforce1StartMessage=Title=<size=24>Pacific Strike - Herausforderung 3</size>\nPFADFINDER\n<size=24>20. September 1985</size>\nBody=Die HMAS Orion wurde beauftragt, die Anmarschwege zum feindlichen Stützpunkt bei Puerto Princesa City auf Palawan aufzuklären. Nähern Sie sich unentdeckt, identifizieren Sie die Küstenanlagen visuell per Periskop und entkommen Sie anschließend nach Osten, sobald die Aufklärung abgeschlossen ist.\n\nSie dürfen feindliche Einheiten im Gebiet bekämpfen, doch die Aufklärungsmission hat höchste Priorität.\nButtonText=Mission starten\nPopupStyle=Intro
Taskforce1HMASOrionmustsurviveMessage=Title=NIEDERLAGE\nBody=Niederlage! Die HMAS Orion wurde versenkt!\nButtonText=Zurück zur Mission\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=MARITIME HQ\nTo=HMAS ORION\nInfo=HMAS PLATYPUS\nCINCPACFLT PEARL HARBOR HI\nCOMSUBPAC\nSubj=AUFKLÄRUNGSMELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1. (S) Eingang der Periskop-Aufklärungsmeldungen aus den Anmarschwegen nach Puerto Princesa bestätigt.\n\n2. (S) Identifizierte Küstenflugkörperbatterien und zugehörige Landanlagen werden für die Angriffsplanung an TF 77 und die Kommandeure der Landungskräfte übermittelt.\n\n3. (S) Leise Arbeit, saubere Arbeit. Sie haben Augen dorthin gebracht, wo Satelliten nicht hinsehen konnten, und den Marines eine bessere Chance am Strand gegeben. Nach Osten ablaufen und unentdeckt bleiben. MARITIME HQ Ende.\nButtonText=Zurück zur Mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1IdentifyshoreinstallationsMessage=Title=MISSIONSUPDATE\nBody=Kommandant, wir haben die wichtigsten feindlichen Anlagen erfolgreich identifiziert und können nun nach Osten exfiltrieren.\nButtonText=Bestätigen und fortfahren\nPopupStyle=Notification
