Taskforce1StartMessage=Title=<size=24>Pacific Strike - Sub Challenge 3</size>\nPATHFINDERS\n<size=24>September 20th, 1985</size>\nBody=HMAS Orion has been tasked to reconnoiter the approaches to the enemy base at Puerto Princesa City on Palawan. Approach undetected, identify the shore installations via periscope or ESM mast, then escape east once reconnaissance is complete.\n\nYou are free to engage enemy units in the area, but your first priority is reconnaissance.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR PUERTO PRINCESA APPROACHES\nVALID: 202000Z-210200Z SEP 85\nEasterly flow over western Palawan is producing scattered cloud cover and moderate seas at Sea State 3. No organized precipitation, fog, or thunderstorm activity is expected. Visibility should remain generally good through the night, though coastal haze and low cloud may briefly reduce periscope observation near shore.
Taskforce1HMASOrionmustsurviveMessage=Title=DEFEAT\nBody=Defeat! HMAS Orion has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=MARITIME HQ\nTo=HMAS ORION\nInfo=HMAS PLATYPUS\nCINCPACFLT PEARL HARBOR HI\nCOMSUBPAC\nSubj=RECON REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=AustraliaRAN\nBody=1. (S) Receipt confirmed of reconnaissance reports from Puerto Princesa approaches.\n\n2. (S) Identified coastal missile batteries and associated shore installations will be passed to TF 77 and landing force commanders for strike planning.\n\n3. (S) Clear east and remain undetected. COMSUBPAC expects that ORION returns to Darwin flying a broom to indicate the CLEAN SWEEP. Bravo Zulu, ORION.\nButtonText=Return to mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1IdentifyshoreinstallationsMessage=Title=MISSION UPDATE\nBody=Commander, we have successfully identified the major enemy installations, and we can now exfil to the east. The approximate safe area is marked on our chart.\nButtonText=Acknowledge & continue\nPopupStyle=Notification
Objective_ReconInstallations=Identify all coastal missile batteries near the city
Objective_OrionMustSurvive=HMAS Orion must survive
Objective_ReachMarkedArea=Reach the marked area to escape
