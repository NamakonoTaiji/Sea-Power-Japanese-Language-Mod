Taskforce1StartmessageMessage=Title=<size=24>パシフィック・ストライク――潜水艦チャレンジ1</size>\n深く静かに潜航せよ\n<size=24>1985年7月8日</size>\nBody=同盟軍情報部は、南シナ海で活動中のソ連通常型潜水艦部隊へ補給を行っているドン型潜水母艦の位置を、スプラトリー諸島のジャクソン礁で特定した。スプラトリー諸島へ潜入して当該艦を撃滅し、パラワン海峡へ脱出せよ。\n\n注記：ベトナム軍は同海域に2箇所の大規模な機雷原を敷設している。正確な範囲は不明だが、予想危険区域を地図上に示した。脱出するには両機雷原を回避しなければならない。\nButtonText=ミッション開始\nPopupStyle=Intro
StartmessageForecast=スプラトリー諸島海域艦隊気象予報\n有効期間：85年7月8日1000Z～1600Z\nスプラトリー諸島中部を覆う広範な南東季節風により、全天が雲に覆われ、ジャクソン礁付近の暗礁や浅瀬では靄が持続し、所々で海霧が発生している。海況は4で中程度の波が立ち、低い雲や霧の区域では水上視程の低下が予想される。午後を通じて条件は不良のままとなる見込みで、潜航作戦には有利だが、目視による捜索と識別は困難となる。
Taskforce1HoustonmustsurviveMessage=Title=作戦失敗\nBody=敗北！ USS ヒューストンが撃沈された！\nButtonText=プレイを続ける\nPopupStyle=Outro
Taskforce1Houstonreachesareatoescape-playervictoryMessage=From=太平洋艦隊潜水艦部隊司令官（COMSUBPAC）\nTo=USS ヒューストン\nInfo=第77任務部隊指揮官（CTF 77）\n太平洋艦隊司令長官（ハワイ州パールハーバー）\nSubj=潜水艦報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) ジャクソン礁における敵潜水母艦の撃沈、およびパラワン海峡への脱出成功を報告する貴艦の電文を受領した。\n\n2. (S) 同盟軍情報部は、南シナ海における敵通常型潜水艦の作戦行動が大きく阻害されたと判断する。この海域における今後のソ連潜水艦の活動は減少する見込みである。\n\n3. (S) 見事な働きである。指定の会合地点へ向かい、ダーウィンで再編中の同盟軍に再合流せよ。太平洋艦隊潜水艦部隊司令官より。\nButtonText=プレイを続ける\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1MinefieldSEMessage=Title=作戦失敗\nBody=敗北！ 既知の機雷原で触雷し、本艦は喪失した！\nButtonText=プレイを続ける\nPopupStyle=Outro
Taskforce1MinefieldSWMessage=Title=作戦失敗\nBody=敗北！ 既知の機雷原で触雷し、本艦は喪失した！\nButtonText=プレイを続ける\nPopupStyle=Outro
Taskforce1DestroyDon-activateescapeMessage=Title=任務更新\nBody=「艦長、敵潜水母艦を撃沈しました。南方への脱出路は確保されました」\nButtonText=了解して続行\nPopupStyle=Notification
