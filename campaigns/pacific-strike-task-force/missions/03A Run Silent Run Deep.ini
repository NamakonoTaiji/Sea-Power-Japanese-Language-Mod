Taskforce1StartmessageMessage=Title=<size=24>Pacific Strike - Sub Challenge 1</size>\nRUN SILENT, RUN DEEP\n<size=24>July 8th, 1985</size>\nBody=Allied intelligence has located a Don class submarine tender at Jackson Atoll in the Spratly Islands which is resupplying a group of Soviet diesel submarines operating in the South China Sea. Infiltrate into the Spratlys, destroy this vessel, and then escape into the Palawan Passage.\n\nNote: Vietnamese forces have laid two large minefields in the area. Their full extent is not known but expected danger area is marked on your map. These must be avoided to escape.\nButtonText=Start mission\nPopupStyle=Intro
StartmessageForecast=FLEET WEATHER FORECAST FOR SPRATLY ISLANDS AREA\nVALID: 081000Z-081600Z JUL 85\nA broad southeast monsoonal flow across the central Spratlys is maintaining overcast skies, persistent haze, and patchy sea fog around the reefs and shoals near Jackson Atoll. Seas are running at Sea State 4, with moderate chop and reduced surface visibility expected in low cloud and fog banks. Conditions should remain marginal through the afternoon, favoring submerged operations but complicating visual search and identification.
Taskforce1HoustonmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! USS Houston has been sunk!\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1Houstonreachesareatoescape-playervictoryMessage=From=COMSUBPAC\nTo=USS HOUSTON\nInfo=CTF 77\nCINCPACFLT PEARL HARBOR HI\nSubj=SUBMARINE REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Receipt confirmed of your message traffic reporting destruction of enemy submarine tender at Jackson Atoll and successful escape into the Palawan Passage.\n\n2. (S) Allied intelligence assesses enemy diesel submarine operations in the South China Sea have been materially disrupted. Follow-on Soviet submarine activity in this sector is expected to be reduced.\n\n3. (S) Outstanding work. Proceed to assigned rendezvous and rejoin Allied forces reconsolidating at Darwin. COMSUBPAC sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1MinefieldSEMessage=Title=MISSION FAILED\nBody=Defeat! You have struck a mine in the known minefield and the boat is lost!\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1MinefieldSWMessage=Title=MISSION FAILED\nBody=Defeat! You have struck a mine in the known minefield and the boat is lost!\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1DestroyDon-activateescapeMessage=Title=MISSION UPDATE\nBody="Captain, the enemy sub tender has been sunk. We are clear to escape to the south."\nButtonText=Acknowledge & continue\nPopupStyle=Notification
Objective_DestroyTender=Destroy the Don class tender
Objective_HoustonMustSurvive=USS Houston must survive
