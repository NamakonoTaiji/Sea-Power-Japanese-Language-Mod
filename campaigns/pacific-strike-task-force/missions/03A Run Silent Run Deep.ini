Taskforce1StartmessageMessage=Title=<size=24>Дополнительная миссия:</size>\nГлубоко и тихо\n<size=24>Июль 8-е, 1985</size>\nBody=Разведка союзников обнаружила в архипелаге Спратли плавбазу подводных лодок типа «Дон», поддерживающую группу советских дизельных подводных лодок, действующих в Южно-Китайском море. Достигните архипелага Спратли, найдите и уничтожьте плавбазу, а затем отходите Палаванским проливом.\n\nNote: ВМС Вьетнама установили два минных поля в этом районе. Их местоположение отмечено на карте. Избегайте этих зон.\nButtonText=Начать миссию\nPopupStyle=Intro
StartmessageForecast=Прогноз погоды для района островов Спратли\nАктуален: 081000Z-081600Z Июль 85\nЮго-восточный муссон, охватывающий центральную часть островов Спратли, обусловливает сплошную облачность, устойчивую дымку, местами туманы в районе рифов и отмелей у атолла Джексон. Волнение моря - 4 балла. Видимость у поверхности ограничена из-за низких облаков и полос тумана. В течение второй половины дня условия останутся сложными: они благоприятствуют гидроаккустическому наблюдению, но затрудняют визуальный поиск и идентификацию.
Taskforce1HoustonmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! USS «Хьюстон» был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1Houstonreachesareatoescape-playervictoryMessage=From=Ком. подв. силами США на Тихом Океане\nTo=Ком. USS «Хьюстон» SSN-713\nInfo=Ком ТГ 77\nКом. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Мы подтверждаем получение Вашего сообщения, сообщающего об  уничтожении вражеской плавбазы на атолле Джексон и успешном отходе в Палаванский пролив.\n\n2. (S) Разведка считает, что действия вражеских дизельных подводных лодок в Южно-Китайское море будут существенно сокращены.\n\n3. (S) Отличная работа! Двигайтесь к точке рандеву с союзными войсками, в Дарвине.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1MinefieldSEMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! USS «Хьюстон» подорвался на мине и был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1MinefieldSWMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! USS «Хьюстон» подорвался на мине и был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1DestroyDon-activateescapeMessage=Title=МИССИЯ ОБНОВЛЕНА\nBody=Капитан, вражеская плавбаза потоплена. Теперь мы можем отходить на юг.\nButtonText=Признание и продолжение\nPopupStyle=Notification
