Taskforce1StartmessageMessage=Title=<size=24>出击太平洋：潜艇挑战1</size>\n无声潜航\n<size=24>1985年7月8日</size>\nBody=盟军情报部门在南沙群岛的五方礁发现了一艘310型潜艇补给舰，它正在为一个在南海活动的苏联柴电潜艇群提供补给。潜入南沙群岛，摧毁此补给舰，之后撤往巴拉望航道。\n\n注意：越南军队在此区域内布设了两处大型雷区。雷区范围尚不明确，但地图上已标出预计危险区域。你必须避开雷区才能撤离。\nButtonText=开始任务\nPopupStyle=Intro
StartmessageForecast=南沙群岛区域舰队天气预报\n有效期：1985年7月8日1000Z时至8日1600Z时\n穿过南沙群岛中部的东南季风导致五方礁附近海域阴云密布，持续出现霾和零星海雾。海况为4级，有中等程度碎浪。预计低云和雾堤会降低水面能见度。下午的海况仍然恶劣，利于潜艇行动，但会提高视觉搜索和识别的难度。
Taskforce1HoustonmustsurviveMessage=Title=任务失败！\nBody=任务失败！休斯顿号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1Houstonreachesareatoescape-playervictoryMessage=From=太平洋潜艇部队司令\nTo=休斯顿号潜艇\nInfo=第77特遣舰队指挥官\n夏威夷州珍珠港太平洋舰队总司令\nSubj=潜艇报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）已确认收到你在五方礁摧毁敌方潜艇补给舰并成功撤往巴拉望航道的消息。\n\n2.（机密）盟军情报评估认为敌方柴电潜艇在南海的行动已受到严重干扰。预计苏联潜艇在此区域内的后续活动将会减少。\n\n3.（机密）休斯顿号潜艇表现出色。前往指定会合点，加入在达尔文集结的盟军部队。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1MinefieldSEMessage=Title=任务失败！\nBody=任务失败！你已在未知雷区触雷并沉没！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1MinefieldSWMessage=Title=任务失败！\nBody=任务失败！你已在未知雷区触雷并沉没！\nButtonText=返回任务\nPopupStyle=Outro
