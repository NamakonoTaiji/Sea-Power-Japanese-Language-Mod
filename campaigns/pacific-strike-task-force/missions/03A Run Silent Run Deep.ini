Taskforce1StartmessageMessage=Title=<size=24>Pacific Strike - U-Boot-Herausforderung 1</size>\nLEISE FAHREN, TIEF FAHREN\n<size=24>8. Juli 1985</size>\nBody=Die alliierte Aufklärung hat am Jackson Atoll in den Spratly-Inseln ein U-Boot-Versorgungsschiff der Don-Klasse lokalisiert, das eine Gruppe sowjetischer Diesel-U-Boote versorgt, die im Südchinesischen Meer operieren. Dringen Sie in die Spratlys ein, zerstören Sie dieses Schiff und entkommen Sie anschließend in die Palawan-Passage.\n\nHinweis: Vietnamesische Kräfte haben im Gebiet zwei große Minenfelder gelegt. Ihre volle Ausdehnung ist nicht bekannt, der erwartete Gefahrenbereich ist jedoch auf Ihrer Karte markiert. Diese Bereiche müssen umgangen werden, um zu entkommen.\nButtonText=Mission starten\nPopupStyle=Intro
StartmessageForecast=FLOTTEN-WETTERVORHERSAGE FÜR DEN RAUM SPRATLY-INSELN\nGÜLTIG: 081000Z-081600Z JUL 85\nEine ausgedehnte südöstliche Monsunströmung über den zentralen Spratly-Inseln sorgt für bedeckten Himmel, anhaltigen Dunst und vereinzelten Seenebel im Bereich der Riffe und Untiefen nahe dem Jackson Atoll. Die See läuft bei Seegangsstufe 4 mit mäßigem Seegang. In niedrigen Wolken und Nebelbänken ist mit eingeschränkter Sicht an der Oberfläche zu rechnen. Die Bedingungen bleiben voraussichtlich bis zum Nachmittag grenzwertig und begünstigen getauchte Operationen, erschweren jedoch die optische Suche und Identifizierung.
Taskforce1HoustonmustsurviveMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! Die USS Houston wurde versenkt!\nButtonText=Weiterspielen\nPopupStyle=Outro
Taskforce1Houstonreachesareatoescape-playervictoryMessage=From=COMSUBPAC\nTo=USS HOUSTON\nInfo=CTF 77\nCINCPACFLT PEARL HARBOR HI\nSubj=U-BOOT-MELDUNG - MISSION ERFÜLLT\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Eingang Ihrer Meldungen über die Zerstörung des feindlichen U-Boot-Versorgungsschiffs am Jackson Atoll und die erfolgreiche Flucht in die Palawan-Passage bestätigt.\n\n2. (S) Die alliierte Aufklärung bewertet die feindlichen Diesel-U-Boot-Operationen im Südchinesischen Meer als erheblich gestört. Mit verringerter sowjetischer U-Boot-Aktivität in diesem Sektor ist zu rechnen.\n\n3. (S) Hervorragende Arbeit. Laufen Sie zum zugewiesenen Treffpunkt und schließen Sie sich den alliierten Kräften an, die sich in Darwin neu formieren. COMSUBPAC Ende.\nButtonText=Weiterspielen\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1MinefieldSEMessage=Title=MISSION FFEHLGESCHLAGEN\nBody=Niederlage! Sie sind in einem bekannten Minenfeld auf eine Mine gelaufen, und das Boot ist verloren!\nButtonText=Weiterspielen\nPopupStyle=Outro
Taskforce1MinefieldSWMessage=Title=MISSION FEHLGESCHLAGEN\nBody=Niederlage! Sie sind in einem bekannten Minenfeld auf eine Mine gelaufen, und das Boot ist verloren!\nButtonText=Weiterspielen\nPopupStyle=Outro
Taskforce1DestroyDon-activateescapeMessage=Title=MISSIONSUPDATE\nBody="Captain, das feindliche U-Boot-Versorgungsschiff wurde versenkt. Wir haben Freigabe, nach Süden zu entkommen."\nButtonText=Bestätigen und fortfahren\nPopupStyle=Notification
