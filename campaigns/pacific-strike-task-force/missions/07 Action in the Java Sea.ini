Taskforce1StartMessage=Title=<size=24>Тихоокеанский Удар - Часть 7</size>\nБой в Яванском море\n<size=24> 27 августа 1985</size>\nBody={TaskForceName} поставлена задача найти и уничтожить КУГ противника в Яванском море. Эта КУГ создаёт угрозу Джакарте, и её разгром позволит Индонезии полноценно вступить в войну на стороне союзников.\n\nКУГ «Сенявин», вероятно, поддерживают как минимум две подводные лодки.\n\n Ваша авиация развёрнута в аэропорту им. Джуанды в Сурабае и доступна для выполнения задач.\nButtonText=Начать миссию\nPopupStyle=Intro
StartForecast=Прогноз погоды для района Яванского моря\nАктуален: 261100Z-261800Z Август 85\nЮго-восточный муссон над Яванским морем обусловливает значительную облачность. Скорость ветра составляет 10–15 узлов, волнение моря слабое. К 12:00 UTC ожидается усиление ветра, облачность, дожди, местами грозы. Волнение моря усилится до 3 баллов, видимость снизится.
Taskforce1FlagshipmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Разведка и радиоперехваты подтверждают уничтожение советских надводных сил в Яванском море.\n\n2. (S) Угроза Джакарте снята. Правительство Индонезии уведомило командующего Тихоокеанским командованием о немедленном возобновлении сотрудничества с силами союзников.\n\n3. (S) Объединенный комитет начальников штабов лично поздравляет командующего {TaskForceName} и все экипажи с отлично выполненной работой в сложных условиях.\nButtonText=Вернуться к миссии\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1Time+30SSGNwarningMessage=ПРЕДУПРЕЖДЕНИЕ: АПЛ USS «Драм» передает сообщение о фиксации прерывистых тональных сигналов двухвинтового корабля в точке с координатами 5,2° ю.ш., 109,5° в.д. (время 1248Z). Установлена ​​зона вероятного нахождения цели A01. \n\n2. (S) USS «Драм» возвращается из патруля, её боекомплект израсходован. Ей приказано покинуть район на максимальной скорости. \n\n3. (S) По оценке разведки, данный контакт — ПЛАРК проекта 675, точное местоположение которой не установлено. При благоприятной возможности - атакуйте цель
Taskforce1Time+30SSGNwarningIntel=Американская подводная лодка сообщает о контакте с советской ПЛАРК проекта 675 в зоне A01. ПЛАРК этого типа несет 8 ракет П-500 «Базальт» с дальностью около 300 морских миль. Обратите внимание: В этом районе находится USS «Драм» (SSN-677), возвращающаяся в базу
Taskforce1DestroyDrumMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. подв. силами США на Тихом Океане\nКом. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=USS «Драм» потоплена\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) ВНИМАНИЕ: USS «Драм» доложила об атаке со стороны своих сил в Яванском море. С момента доклада связь с USS «Драм» утрачена.\n\n2. (S) Приказываю немедленно вернуться в район патрулирования и продолжить поиск вражеских подводных лодок.\n\n3. (S) Если позволяет тактическая обстановка, провести поисково-спасательную операцию в районе гибели USS «Драм». Учитывая малую глубину, возможно наличие выживших.\n\n4. (S) По возвращении в Сурабаю {TaskForceName} направить донесение (OPREP) командующему подводными силами Тихоокеанского флота с копией командующему Тихоокеанским флотом , содержащее подробное описание обстоятельств гибели USS «Драм». В ходе дальнейших действий обеспечить надлежащую идентификацию целей. Командование 77-го оперативного соединения расценивает гибель USS «Драм» от огня дружественных сил сил как событие, вызывающее серьезную обеспокоенность и глубокое разочарование на фоне в остальном безупречных действий личного состава.\nButtonText=Продолжить\nPopupStyle=NavalMessage
