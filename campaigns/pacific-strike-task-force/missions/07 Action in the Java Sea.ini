[Language_ru]
Name=07 Бой в Яванском море
Description=После прорыва через Ломбокский пролив ваша оперативная группа получила приказ немедленно двигаться в Яванское море. Крупные советские надводные силы, возглавляемые крейсером «Адмирал Сенявин», действуют к северу от Джакарты и создают угрозу Индонезии. Уничтожение этих сил позволит Индонезии полноценно вступить в войну на стороне союзников.
