Taskforce1StartMessage=Title=<size=24>出击太平洋：第7部分</size>\n进入爪哇海\n<size=24>1985年8月27日</size>\nBody={TaskForceName}收到命令找到并摧毁爪哇海的一支苏联大型水面部队。敌军正在威胁印度尼西亚的首都雅加达，将其消灭可以使印度尼西亚重新加入盟军一方作战。\n\n苏军很可能至少有两艘潜艇支援，盟军空中部队已在泗水机场集结，随时待命。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=爪哇海区域舰队天气预报\n有效期：1985年8月26日1100Z时至26日1800Z时\n1100Z时，雅加达以北爪哇海上空的东南季风会造成多云天气，东南风风速10-15节，海况为2级。到1200Z时，低层辐合将增加云量、降水和阵风，预计到1215Z时将出现零星雷暴。此后天气状况将持续恶化，海况将达到3级，能见度降低，局部飑线将影响水面和空中行动。
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）侦察和截获无线电确认以谢尼亚文海军上将号巡洋舰为核心的苏联爪哇海水面部队已被摧毁。\n\n2.（机密）对雅加达的威胁已经解除。印度尼西亚政府已通知太平洋司令部总司令，将立即恢复与盟军的联合行动。\n\n3.（机密）参谋长联席会议向指挥官{TaskForceName}和船员们传达私人祝贺，祝贺全体官兵在资源有限、风险极高的情况下出色完成了任务。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1Time+30SSGNwarningMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=\nSubj=接触报告——675型巡航导弹核潜艇基准点A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）提示：美国潜艇鼓鱼号于1248Z时在5.2S，109.5E报告了间歇性双螺旋桨声学信号，基准点A01已建立。\n\n2.（机密）鼓鱼号已耗尽所有弹药，正在以最佳速度撤离此区域。\n\n3.（机密）情报评估表明此接触为位置不明的675型巡航导弹核潜艇。如果战术态势允许，攻击此接触并报告击沉位置。祝你好运，猎杀愉快。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Taskforce1Time+30SSGNwarningIntel=美国潜艇在基准点A01报告了与苏联675型巡航导弹核潜艇的接触，此潜艇携带8枚射程约300海里的P-500导弹。在附近行动的鼓鱼号潜艇（SSN-677）正尝试撤离此区域，请勿与其交战。
Taskforce1DestroyDrumMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=太平洋潜艇部队司令\n夏威夷州珍珠港太平洋舰队总司令\nSubj=行动报告——鼓鱼号的战损\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）提示：鼓鱼号潜艇报告称在爪哇海遭遇友方攻击并随后失联。\n\n2.（机密）立即停止攻击鼓鱼号。返回巡逻区并继续搜索敌方潜艇。\n\n3.（机密）如果战术态势允许，在鼓鱼号沉没区域附近开展搜救行动。由于海床较浅，可能存在幸存者。\n\n4.（机密）返回泗水后，{TaskForceName}指挥官向太平洋潜艇部队司令发送行动报告，详细说明鼓鱼号沉没的全部情况，此报告需抄送太平洋舰队总司令。确保在后续行动中正确识别目标。第77特遣舰队指挥官对鼓鱼号因友军行为而沉没深表关切，并对此次行动无法完美收场深感失望。\nButtonText=收到并继续\nPopupStyle=NavalMessage
