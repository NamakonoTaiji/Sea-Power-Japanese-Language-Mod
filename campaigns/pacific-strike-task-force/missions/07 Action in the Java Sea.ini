[Language_cn]
Name=07进入爪哇海
Description=突破龙目海峡后，{TaskForceName}收到命令立即进入爪哇海。一支以谢尼亚文海军上将号巡洋舰为核心的苏联大型水面部队正在雅加达北部海域活动，对印度尼西亚政府构成威胁。消灭这支部队将使印度尼西亚重新加入盟军一方作战。
