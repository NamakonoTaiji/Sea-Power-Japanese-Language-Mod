Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――第7部</size>\nジャワ海の戦闘\n<size=24>1985年8月27日</size>\nBody={TaskForceName}は、ジャワ海の有力なソ連水上部隊を捜索・撃滅せよ。この部隊はインドネシアの首都ジャカルタを脅かしている。撃滅すれば、インドネシアは同盟軍側として再び参戦する。\n\nソ連部隊は少なくとも2隻の潜水艦に支援されている可能性が高い。同盟軍航空部隊はスラバヤの飛行場に展開しており、任務を割り当てられる。\nButtonText=作戦開始\nPopupStyle=Intro
StartForecast=ジャワ海海域艦隊気象予報\n予報期間：85年8月26日1100Z～26日1800Z\n1100Z時点、ジャカルタ北方のジャワ海では南東季節風により雲が所々に広がり、南東風10～15ノット、波は穏やか。1200Zまでに下層の収束によって雲量、降水、突風が増し、1215Zごろには所により雷雨となる見込み。予報期間を通じて天候は悪化し、海況はシーステート3に達する。視程の低下と局地的なスコールが水上・航空作戦に影響を及ぼす。
Taskforce1FlagshipmustsurviveMessage=Title=作戦失敗\nBody=敗北！{FlagshipName}が撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官　パールハーバー、ハワイ州\nSubj=偵察報告――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 偵察と無線傍受により、アドミラル・セニャーヴィンを中心とするジャワ海のソ連水上部隊の撃滅を確認した。\n\n2. (S) ジャカルタへの脅威は取り除かれた。インドネシア政府は、直ちに同盟軍とともに積極的な作戦行動を再開すると太平洋軍司令官に通告した。\n\n3. (S) 限られた戦力と高い危険の中で任務を果たした{TaskForceName}指揮官と全乗組員に、統合参謀本部から直接祝意が伝えられた。第77任務部隊指揮官より。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1Time+30SSGNwarningMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=\nSubj=接触報告――エコーII型SSGN、データムA01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 警告：米潜水艦ドラム（DRUM）から、1248Z、南緯5.2度・東経109.5度で断続的な二軸推進音を探知したとの報告があった。データムA01を設定した。\n\n2. (S) ドラムは兵装をすべて使い果たし、最大速力で同海域から離脱中である。\n\n3. (S) 情報部は、この接触を位置未特定のエコーII（ECHO II）型巡航ミサイル原子力潜水艦（SSGN）と評価している。戦術状況が許せばこの目標を追跡・攻撃し、撃沈位置を報告せよ。諸君の健闘と武運を祈る。\nButtonText=了解して続行\nPopupStyle=NavalMessage
Taskforce1Time+30SSGNwarningIntel=米潜水艦がデータムA01でソ連のエコーII（ECHO II）型SSGNとの接触を報告。エコーII型SSGNは射程約300海里のSS-N-12ミサイルを8発搭載する。USSドラム（SSN-677）が付近で同海域からの離脱を図っている。ドラムを攻撃してはならない。
Taskforce1DestroyDrumMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊潜水艦部隊司令官（COMSUBPAC）\n太平洋艦隊司令長官　パールハーバー、ハワイ州\nSubj=作戦報告――USSドラム喪失\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 警告：USSドラムから、ジャワ海で友軍の攻撃を受けたとの報告があった。その後、ドラムとの連絡は途絶えた。\n\n2. (S) 直ちにドラムに対する攻撃を中止せよ。哨戒位置に戻り、敵潜水艦の捜索を続けよ。\n\n3. (S) 戦術状況が許せば、ドラムの沈没地点付近で戦闘捜索救難（CSAR）を実施せよ。海域が浅いため、生存者がいる可能性がある。\n\n4. (S) スラバヤ帰投後、{TaskForceName}はドラム沈没の全経緯を記した作戦報告書（OPREP）を太平洋艦隊潜水艦部隊司令官（COMSUBPAC）へ提出し、太平洋艦隊司令長官（CINCPACFLT）にも送付せよ。今後の行動では目標識別を徹底せよ。第77任務部隊指揮官は、それまでの優れた戦果にもかかわらず、友軍の攻撃によるドラム喪失を深く憂慮し、失望している。第77任務部隊指揮官より。\nButtonText=了解して続行\nPopupStyle=NavalMessage
