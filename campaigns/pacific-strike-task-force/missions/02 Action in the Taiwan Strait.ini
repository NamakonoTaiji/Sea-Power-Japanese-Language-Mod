Taskforce1StartMessage=Title=<size=24>Тихоокеанский Удар - Часть 2</size>\nБой в Тайваньском проливе\n<size=24>Июнь 30е, 1985</size>\nBody=Китай захватил инициативу и начал операцию по захвату островов в Тайваньском проливе. Вашей группе поставлена задача нанести удар по десантным силам, движущимся к острову Дунъинь.\n\nE-3A «Darkstar» находится на позиции к северу от Тайбэя. Уничтожьте силы вторжения НОАК и силы прикрытия, поддерживающие десант.\nButtonText=Начать миссию\nPopupStyle=Intro
StartForecast=Прогноз погоды для Тайваньского пролива\nАктуален: 301000Z-301600Z июнь 85\nВ период с 00:00 до 06:00 UTC в районе Тайваньского пролива сохраняются стабильные погодные условия: низкое атмосферное давление обусловливает устойчивый северо-западный ветер и умеренное волнение моря. Облачно, видимость хорошая, осадков и тумана не ожидается. В течение оставшейся части дня существенных изменений не прогнозируется
Taskforce1FlagshipmustsurviveMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1Landingforcedestroyed-playervictoryMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nКом. ВВС США в Японии, Авиабаза Хикам\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Разведка подтверждает, что все силы противника были уничтожены.\n\n2. (S) Вражеские десантные силы второй волны, поворачивают назад.\n\n3. (S) Благодарим за отличную работу. Двигайтесь к Окинаве с максимальной скоростью для дозаправки и пополнения боекомплекта.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1InvasionforcereachesDongyin-playerdefeatMessage=From=CINCPACFLT\nTo={TaskForceName}\nInfo=Ком. ТГ 77 Наха, Япония\nКом. ВМС США в Японии, Авиабаза Йокота\nSubj=МИССИЯ ПРОВАЛЕНА: Десант НОАК высадился на острове Дунъинь\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Мы получаем сообщения о присутствии морской пехоты НОАК на острове Дунъинь.\n\n2. (S) Разведка полагает что, к 2 июля силы обороняющие Дунъинь будут разгромлены.\n\n3. (S) Немедленно возвращайтесь с максимальной скоростью на Окинаву. Из Нахи вы будете доставлены в Хикам, где вам придётся представить подробный отчёт о своих действиях.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1LudaSAGwarningMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=\nSubj=Обнаружена вражеская КУГ\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) ПРЕДУПРЕЖДЕНИЕ: Приближающаяся группа военных кораблей НОАК на юго-западе идентифицирована как 2 эсминца Тип 051 (Люйда I).\n\n2. (S) Каждый из них несёт 6 противокорабельных ракет HY-1A с дальностью полета 43 морских мили.\n\n3. (S) Уничтожение этих кораблей до того, как они войдут в зону пуска своих ракет является задачей повышенной важности. Удачи и хорошей охоты.\nButtonText=Продолжить\nPopupStyle=NavalMessage
Taskforce1LudaSAGwarningIntel=ПРЕДУПРЕЖДЕНИЕ: Приближающаяся группа военных кораблей НОАК на юго-западе идентифицирована как 2 эсминца Тип 051 (Люйда I). Они несут по 6 ПКР с дальностью 43 мор. миль.
Objective_DestroyInvasionForce=Уничтожить десант НОАК
Objective_FlagshipMustSurvive={FlagshipName} должен уцелеть
[Language_de]
Name=02 Gefecht in der Taiwanstraße
Description=Während im gesamten westlichen Pazifik Kampfhandlungen im Gange sind, haben die Chinesen die Gelegenheit genutzt, eine Offensive gegen die von den Nationalisten gehaltenen Inseln in der Taiwanstraße zu starten. {TaskForceName} hat den Auftrag erhalten, chinesische Landungstruppen anzugreifen, die sich der Insel Dongyin nähert. Verlegen Sie von Okinawa aus nach Westen und bekämpfen Sie alle gegnerischen Kräfte.
