[Language_ru]
Name=02 Бой в Тайваньском проливе
Description=В рамках боевых действий в западной части Тихого океана НОАК начала наступательную операцию против островов в Тайваньском пролие. Вам приказано нанести удар по китайскому десанту, приближающемуся к острову Дунъинь. Выдвигайтесь к западу от Окинавы, атакуйте и уничтожте силы вторжения.
