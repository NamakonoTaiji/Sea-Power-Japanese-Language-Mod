[Language_cn]
Name=02进入台湾海峡
Description=随着战争在西太平洋爆发，中国军队顺势对台湾海峡上国民党控制的岛屿发动了进攻。{TaskForceName}收到命令打击一支正在靠近东引岛的登陆部队。从冲绳向西航行，消灭这支部队。
