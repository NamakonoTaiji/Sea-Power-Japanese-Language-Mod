Taskforce1StartMessage=Title=<size=24>出击太平洋：第2部分</size>\n进入台湾海峡\n<size=24>1985年6月30日</size>\nBody=中国军队已掌握主动权，对台湾海峡上国民党控制的岛屿发动了进攻。{TaskForceName}收到命令打击前往东引岛的登陆部队。\n\nE-3A“暗星”已抵达台北以北。消灭靠近东引岛的中国海军登陆部队，之后向东撤离。剩余的敌方水面部队是可选目标。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=台湾海峡舰队天气预报\n有效期：1985年6月30日1000Z时至30日1600Z时\n台湾海峡海域自1000Z时至1600Z时期间天气稳定，气压梯度较弱，有稳定西北风，海况为3级。多云持续，能见度良好，预计无降水或雾。预计今日剩余时间内天气变化不大，空中和水面行动条件将保持良好。
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1Landingforcedestroyed-playervictoryMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\n夏威夷州希卡姆空军基地太平洋空军总司令\nSubj=侦察报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）国民党监测站确认敌方登陆舰艇已被消灭。\n\n2.（机密）为第二波攻势集结的敌军正在撤退。\n\n3.（机密）全体官兵表现出色。以最佳速度向东撤往冲绳补充弹药和燃料。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1InvasionforcereachesDongyin-playerdefeatMessage=From=太平洋舰队总司令\nTo={TaskForceName}\nInfo=日本冲绳那霸第77特遣舰队指挥官\n日本横田空军基地美国驻日本部队司令\nSubj=登陆部队登上东引岛——任务失败\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）岸上的国民党守军报告称中国海军的两栖舰艇正在东引岛卸下海军步兵突击部队。\n\n2.（机密）情报评估显示国民党守军将于7月2日前溃败。\n\n3.（机密）立即以最佳速度撤往冲绳。抵达那霸后，乘坐第一班可用的军机前往希卡姆基地进行汇报。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1LudaSAGwarningMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=\nSubj=接触报告——中国海军水面行动群\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）提示：西南方向的中国海军编队被识别为2艘051型驱逐舰。\n\n2.（机密）2.每艘051型驱逐舰携带6枚射程43海里的海鹰-1A导弹。\n\n3.（机密）3.优先在这些船只进入射程前将其摧毁。祝你好运，猎杀愉快。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Taskforce1LudaSAGwarningIntel=提示：西南方向的中国海军编队被识别为2艘051型驱逐舰，每艘携带6枚射程43海里的海鹰-1A导弹。
