Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――第2部</size>\n台湾海峡の戦闘\n<size=24>1985年6月30日</size>\nBody=主導権を掌握した中国軍は、台湾海峡の国民党支配下の諸島に対する強襲を開始した。{TaskForceName}は、東引島へ向かう揚陸部隊への打撃任務を命じられた。\n\nE-3A「ダークスター」は台北北方の定位置に展開中である。東引島へ接近中の中国海軍（PLAN）揚陸艦2隻を撃沈し、その後は東方へ退避せよ。残存する中国海軍水上部隊の撃滅は任意とする。\nButtonText=ミッション開始\nPopupStyle=Intro
StartForecast=台湾海峡艦隊気象予報\n有効期間：85年6月30日1000Z～30日1600Z\n0000Zから0600Zにかけて台湾海峡は安定した気象条件となり、弱い気圧傾度により北西の風が安定して吹き、波浪は中程度となる。断続的な雲が残るものの視程は良好で、降水や霧の予想はない。本日後半にかけても大きな変化はなく、航空・水上作戦に好適な状態が続く見込みである。
Taskforce1FlagshipmustsurviveMessage=Title=作戦失敗\nBody=敗北！ {FlagshipName}が撃沈された！\nButtonText=ミッションへ戻る\nPopupStyle=Outro
Taskforce1Landingforcedestroyed-playervictoryMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=太平洋艦隊司令長官（ハワイ州パールハーバー）\n太平洋空軍司令官（ハワイ州ヒッカム空軍基地）\nSubj=偵察報告――任務完了\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 国民党の監視所より、敵揚陸艦の撃沈を確認したとの通報あり。\n\n2. (S) 第二波攻撃のため集結中であった敵部隊は反転退避しつつある。\n\n3. (S) 全員、見事な働きであった。最高速で東進して沖縄へ帰投し、再武装および燃料補給を行え。第77任務部隊指揮官より。\nButtonText=プレイを続ける\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1InvasionforcereachesDongyin-playerdefeatMessage=From=太平洋艦隊司令長官（CINCPACFLT）\nTo={TaskForceName}\nInfo=第77任務部隊指揮官（那覇、日本）\n在日米軍司令官（横田基地、日本）\nSubj=東引島への揚陸部隊上陸――任務失敗\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 現地の国民党守備隊より、中国軍の揚陸艦艇が東引島に中国人民解放軍（PLA）海軍陸戦隊の強襲部隊を揚陸中との報告あり。\n\n2. (S) 情報部は、国民党軍が7月2日までに圧倒されると判断する。\n\n3. (S) 直ちに最高速で沖縄へ退避せよ。那覇に到着後、利用可能な最初の軍用便でヒッカム基地へ向かい、任務報告を行え。\nButtonText=ミッションへ戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1LudaSAGwarningMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=\nSubj=接触報告――中国海軍旅大級水上戦闘群\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 警告：貴部隊の南西から接近中の中国海軍（PLAN）艦艇群は、旅大（LUDA）級駆逐艦2隻と識別された。\n\n2. (S) 旅大級駆逐艦は各艦とも、射程43海里のHY-1A対艦ミサイルを6発搭載している。\n\n3. (S) 敵がミサイル射程内に入る前に、これらの艦艇を優先して撃滅せよ。諸君の健闘と武運を祈る。\nButtonText=了解して続行\nPopupStyle=NavalMessage
Taskforce1LudaSAGwarningIntel=警告：貴部隊の南西から接近中の中国海軍（PLAN）艦艇群は、旅大（LUDA）級駆逐艦2隻と識別された。旅大級駆逐艦は各艦とも、射程43海里のHY-1A対艦ミサイルを6発搭載している。
