Taskforce1StartMessage=Title=<size=24>Pacific Strike - Part 2</size>\nACTION IN THE TAIWAN STRAIT\n<size=24>June 30th, 1985</size>\nBody=The Chinese have seized the initiative and launched an assault against the Nationalist-held islands in the Taiwan Strait. {TaskForceName} has been tasked to strike the landing forces destined for Dongyin Island.\n\nE-3A "Darkstar" is on station north of Taipei. Destroy both the PLAN landing ships approaching Dongyin, then retire east. Destruction of remaining PLAN surface forces is optional.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR TAIWAN STRAIT\nVALID: 301000Z-301600Z JUN 85\nStable conditions prevail across the Taiwan Strait from 0000Z to 0600Z, with a weak pressure gradient maintaining steady northwesterly winds and moderate seas. Broken cloud cover persists with good visibility and no precipitation or fog expected. Little change is anticipated through the remainder of the day, with conditions remaining favorable for air and surface operations.
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Return to mission\nPopupStyle=Outro
Taskforce1Landingforcedestroyed-playervictoryMessage=From=CTF 77\nTo={TaskForceName}\nInfo=CINCPACFLT PEARL HARBOR HI\nCINCPACAF HICKAM AFB HI\nSubj=RECON REPORT-MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Nationalist monitoring station passes confirmation enemy landing ships have been confirmed destroyed.\n\n2. (S) Enemy forces marshaling for second wave are turning back.\n\n3. (S) Excellent performance by all hands. Retire east at best speed to Okinawa for rearm and refuel. CTF 77 sends.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1InvasionforcereachesDongyin-playerdefeatMessage=From=CINCPACFLT\nTo={TaskForceName}\nInfo=CTF 77 NAHA JA\nCOMUSJAPAN YOKOTA AB JA\nSubj=DONGYIN LANDING FORCE ASHORE-MISSION FAILED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Nationalist defenders ashore report PRC amphibs unloading PLA naval infantry assault force at Dongyin.\n\n2. (S) Intel assesses that Nationalist forces will be overwhelmed by July 2.\n\n3. (S) Retire immediately at best speed to Okinawa. At Naha, board first available military flight to Hickam for debriefing.\nButtonText=Return to mission\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1LudaSAGwarningMessage=From=CTF 77\nTo={TaskForceName}\nInfo=\nSubj=CONTACT REPORT-PLAN LUDA SAG\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) WARNING: Inbound group of PLAN warships to your southwest is identified as 2 x LUDA class destroyers.\n\n2. (S) LUDA class DD carries 6 x HY-1A missile with 43nm range.\n\n3. (S) Prioritize destruction of these ships before they enter missile range. Good luck and good hunting.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Taskforce1LudaSAGwarningIntel=WARNING: Inbound group of PLAN warships to your southwest is identified as 2 x LUDA class destroyers. LUDA class DD carries 6 x HY-1A missile with 43nm range.
Objective_DestroyInvasionForce=Destroy PLA landing ships
