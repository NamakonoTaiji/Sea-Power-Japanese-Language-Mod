Taskforce1StartMessage=Title=<size=24>パシフィック・ストライク――第10部</size>\nルソン沖の報復\n<size=24>1985年10月8日</size>\nBody=敵はパラワン島の部隊を救援するため、南シナ海で総力を挙げている。キエフ打撃群は昨日、カムラン湾からの増援船団を援護しながら香港を発って南東へ進んだ。増援がパラワン島に到達する前に、船団とキエフ打撃群をともに撃滅せよ。\nButtonText=作戦開始\nPopupStyle=Intro
StartForecast=南シナ海海域艦隊気象予報\n予報期間：85年10月8日2000Z～9日0200Z\nルソン島西部とスールー海北部にかかる熱帯暴風雨により、全天が雲に覆われ、雷雨、雨、霧が発生し、海況はシーステート4と荒れている。作戦開始時の視程は悪く、嵐が弱まり始めるまでクラーク飛行場からの航空作戦は制限される。2130Zから2200Zにかけて、まず雨が上がり、続いて霧と雷雨が東へ移動するため、天候は改善し、海況もシーステート3へ向けて穏やかになる見込み。
Taskforce1FlagshipmustsurviveMessage=Title=作戦失敗\nBody=敗北！{FlagshipName}が撃沈された！\nButtonText=任務に戻る\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=太平洋艦隊司令長官（CINCPACFLT）\nTo={TaskForceName}\nInfo=統合参謀本部　ワシントンD.C.\n在日米軍司令官（COMUSJAPAN）　横田基地、日本\n在フィリピン米軍司令官（COMUSPHIL）　マニラ、フィリピン\nSubj=撃破判定――任務達成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=指揮官宛、親展\n\n1. (S) 国家技術偵察手段とクラーク基地からの報告により、キエフ打撃群の撃滅を確認した。カムラン湾からの増援船団はパラワン島到達前に阻止された。\n\n2. (S) パラワン島の敵部隊を救援する試みは失敗した。揚陸部隊の指揮官らは、戦況に影響を及ぼせる時間内に組織だった海上増援がケソンに到達することはないと判断している。\n\n3. (S) 今回の戦果により、南シナ海におけるソ連の主要な空母脅威は排除され、チャレンジャー作戦に不可欠な時間が確保された。\n\n4. (S) 見事な働きだ、指揮官。可能な限り生存者を救助し、命令を受けたら補給のためスービックへ後退せよ。太平洋艦隊司令長官より。\nButtonText=任務に戻る\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce130minweatherchangeMessage=From=第77任務部隊指揮官（CTF 77）\nTo={TaskForceName}\nInfo=\nSubj=警告――無線傍受\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) 警告：北西方向からロシア語の超短波（VHF）音声通信を傍受した。艦艇と航空機の連絡網とみられる。敵水上部隊がカムラン湾または海南島からの長距離海上哨戒偵察機と交信している可能性が高い。\n\n2. (S) 防空警報を赤に引き上げることを推奨する。敵機に{TaskForceName}の位置を捕捉されれば、直ちにミサイル攻撃が予想される。健闘を祈る。第77任務部隊指揮官より。\nButtonText=了解して続行\nPopupStyle=NavalMessage
Taskforce1DetectSlavatoshowobjectiveMessage=From=統合参謀本部　ワシントンD.C.\nTo={TaskForceName}\nInfo=第77任務部隊指揮官（CTF 77）　スービック湾、フィリピン\n太平洋艦隊司令長官　パールハーバー、ハワイ州\nSubj=接触報告\nPrecedence=Flash\nClassification=Secret\nTemplate=USAJCS\nBody=1. (S) 警告：南シナ海の増援船団の西方で、スラヴァ級巡洋艦を中核とする別の敵有力水上部隊を探知した。\n\n2. (S) この部隊は今月初めに同盟軍潜水艦に追跡されたが、攻撃を逃れた。\n\n3. (S) 敵増援船団とキエフ打撃群の撃滅が引き続き最優先である。戦術状況が許せば、他の敵部隊に加えてスラヴァ水上戦闘群（SAG）も迎撃・撃滅せよ。諸君の健闘と武運を祈る。\nButtonText=了解して続行\nPopupStyle=NavalMessage
