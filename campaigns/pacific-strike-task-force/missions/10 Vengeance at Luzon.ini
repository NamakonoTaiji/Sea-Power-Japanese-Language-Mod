Name=10吕宋岛的复仇
Description=敌方已派出基辅号航母掩护前往巴拉望岛的增援护航队。我方岸上部队已陷入苦战，敌方的增援部队可能将成为胜负手。从民都洛岛向西航行，找到基辅号，在敌方航母和护航队抵达巴拉望岛之前将其摧毁。
