Taskforce1StartMessage=Title=<size=24>出击太平洋：第10部分</size>\n吕宋岛的复仇\n<size=24>1985年10月8日</size>\nBody=敌军正全力从南海进军，尝试解救其在巴拉望岛的部队。基辅号打击群昨日从香港向东南方移动，掩护一支来自金兰湾的护航队。务必在增援抵达巴拉望岛之前摧毁此护航队和基辅号打击群。\nButtonText=开始任务\nPopupStyle=Intro
StartForecast=南海区域舰队天气预报\n有效期：1985年10月8日2000Z时至9日0200Z时\n吕宋岛西部和苏禄海北部上空的热带风暴带来了密集的阴云、雷暴、降雨、雾和4级海况。初期能见度极差，克拉克机场的起降作业将受到限制，直至风暴开始减弱。预计2130Z时至2200Z时之间，随着降雨渐停，雾和雷暴东移，海况减弱至3级，状况将有所好转。
Taskforce1FlagshipmustsurviveMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1PlayervictoryMessage=From=太平洋舰队总司令\nTo={TaskForceName}\nInfo=华盛顿特区参谋长联席会议\n日本横田空军基地美国驻日本部队司令\n菲律宾马尼拉美国驻菲律宾部队司令\nSubj=杀敌评估——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=指挥官本人阅读\n\n1.（机密）国家技术手段和克拉克机场的报告确认基辅号打击群已被摧毁，来自金兰湾的增援护航队在巴拉望岛附近遭到拦截。\n\n2.（机密）敌方尝试解救巴拉望岛部队的行动已经失败。登陆部队指挥官评估没有成建制的海上增援可以及时抵达奎松并影响当前战局。\n\n3.（机密）你消除了南海方向的重大航母威胁，为挑战者行动争取了关键的时间。\n\n4.（机密）干得漂亮，指挥官。尽可能营救幸存者，再根据指示返回苏比克湾进行补给。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce130minweatherchangeMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=\nSubj=提示——截获无线电\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）我们截获了西北方向的甚高频俄语语音无线电信号，评估其为舰对空协调网。敌方水面部队可能正在与来自金兰湾或海南的远程海上巡逻机进行通信。\n\n2.（机密）建议发布红色防空警报——如果敌机发现{TaskForceName}，就会立即发动导弹打击。祝你好运。\nButtonText=收到并继续\nPopupStyle=NavalMessage
Taskforce1DetectSlavatoshowobjectiveMessage=From=华盛顿特区参谋长联席会议\nTo={TaskForceName}\nInfo=菲律宾苏比克湾第77特遣舰队指挥官\n夏威夷州珍珠港太平洋舰队总司令\nSubj=接触报告\nPrecedence=Flash\nClassification=Secret\nTemplate=USAJCS\nBody=1.（机密）提示：以光荣号为核心的大型水面编队出现在了南海增援护航队的西侧。\n\n2.（机密）盟军潜艇本月初曾跟踪过此编队，但它最终成功逃脱。\n\n3.（机密）摧毁敌方增援护航队和基辅号打击群仍是首要任务。如果战术态势允许，拦截并摧毁光荣号水面行动群。祝你好运，猎杀愉快。\nButtonText=收到并继续\nPopupStyle=NavalMessage
