Description=敵はパラワン島へ向かう増援船団を援護するため、空母キエフを投入した。上陸した我が軍はすでに激戦のさなかにあり、敵の新たな戦力が戦いの趨勢を決めかねない。パラワン島から北上してキエフを発見し、空母と船団が同島に到達する前に撃滅せよ。
