[Language_ru]
Name=10 Возмездие в Лусоне
Description=Наши войска на острове Палаван ведут тяжёлые бои. Противник оказывает ожесточённое сопротивление и исход сражения пока неясен. Для поддержки своих сил на острове противник отправил конвой с мощным эскортом в состав которого входит авианесущий крейсер «Киев». Выдвигайтесь к западу от Миндоро, обнаружьте «Киев» и уничтожьте его и конвой, прежде чем они смогут достичь Палавана.
