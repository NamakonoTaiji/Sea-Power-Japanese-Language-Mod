; Dynamic Unit Generation v1.0 for Pacific Strike/linear campaigns
; This describes how Dynamic Unit Generator will work in campaign modes.
; Dynamic Unit Generator pulls from this list, assigns units to missions, and then updates the campaign savefile with the theater ORBAT as ships are destroyed or used in missions
; Missions require pre-placed units with their waypoints/triggers/scripted events, and then Generator will replace those units with either single units or formations defined here

; Ships/Submarines:
; Flagships - pre-placed in missions, usually have triggers built on them - are not added as generated units
; Persistent - units with defined variants are persistent; killing in one mission kills them for the campaign and they are tracked
; Reusable - light units that do not have specific variants use the default variant and can be repeated across scenarios

; Aircraft:
; Generator pulls the correct aircraft types and squadrons from this list - the numbers after are the default formation sizes that are spawned
; Aircraft are then placed on top of whatever unit is marked as the dynamic replacement slot

; ---

; Formation rendering:
; GeneratedFormation=Circle uses the native formation circle. Set GeneratedFormationSpacing in nautical miles.
; GeneratedFormation=Loose preserves the authored StationN/OffsetN placement. It is the default.
; MinStations is the minimum number of units that may render after difficulty scaling.
; CustomFields applies key/value pairs to every station; StationNCustomFields applies only to StationN and overrides shared keys.
; Add Hide after any generation tags to conceal an individual unit's identity and profile in Situation while retaining it in the theater assessment.

