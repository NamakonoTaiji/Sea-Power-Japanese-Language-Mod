[LoadingTips]
Count=19
Header=ヒント
Tip001=ハープーンおよび対艦型トマホークは地形を回避しない。発射前に飛翔経路が開けていることを確認しよう。
Tip002=分散した編隊は、敵がレーダー上でその構成を判別しにくい。
Tip003=スタンダード・ミサイルは、見通し線内の対水上交戦にも使用でき、この用途ではハープーンより信頼性が高い。
Tip004=SH-2Fヘリコプターは、米海軍の護衛艦に空中からの対水上捜索レーダー能力を提供する。艦載レーダーの探知範囲を超えて水上目標を探知できるが、航空機の捜索はできない。
Tip005=ソヴレメンヌイ級駆逐艦はSS-N-22サンバーンを搭載する。当時最も高性能な対艦ミサイルだが、射程は50 nmに限られる。
Tip006=ウダロイ級はSA-N-9艦対空ミサイル・システムを搭載し、ハープーンやエグゾセのようなシースキミング・ミサイルに対して特に有効である。
Tip007=航空機による電波妨害は、敵防空網の有効性を大幅に低下させる。
Tip008=SS-N-14A（メテル）対潜兵器は、クリヴァク級とクレスタII級の対潜艦に搭載されている。SS-N-14B（ラストルブ）は副次的な対艦能力を加えた型で、クリヴァクII級、カーラ級、ウダロイ級に搭載され、射程は27 nmである。
Tip009=Tabキーを押すと、戦術ディスプレイ（マップ）をすばやく最大化できる。
Tip010=対応するユニットでZキーを押すと、双眼鏡、光学電子装置、または潜望鏡を使用できる。
Tip011=マップ描画ツールを使えば、識別済みの敵ユニットが持つ艦対空ミサイルや対艦ミサイルの最大射程を記入できる。
Tip012=下部バーの兵器にカーソルを合わせながらAltキーを押すと、その射界が戦術マップと3Dビューに表示される。
Tip013=有線誘導魚雷は、速度、深度、目標地点を手動で指示できる。ただしTEST-71のような初期型魚雷は、発射後に速度と針路しか変更できない。
Tip014=下部バーから開く「状態」パネルには、状況に応じた詳細情報が表示される。選択中ユニットの放射雑音、ヘリコプターの生存者輸送定員、救命いかだのビーコンまでの距離、飛行甲板で利用可能なAIM-54やAGM-84などの個別管理対象弾薬を確認できる。
Tip015=あらゆる種類のソナーは、雑音を発するすべての目標を探知できる。艦載曳航アレイ（SQR-18、SQR-19）を使用し、レーダー見通し距離を大きく超えた敵艦を探知する際に特に有用である。
Tip016=ほとんどのヘリコプターは生存者を救助できる輸送能力を備えている。ただし小型機の一部は、「輸送」兵装で対潜装備を取り外さない限り、少人数しか収容できないか、まったく収容できない。
Tip017=一部の高性能なソ連水上戦闘艦は、ESMを用いた水平線越え目標探知（OTH-T）能力を備えている。特にカーラ級、スラヴァ級、ソヴレメンヌイ級、キーロフ級は、目標が電波を放射している限り、通常のレーダー見通し距離を大きく超えた位置から対艦ミサイルを発射できる。
Tip018=AGM-84D、RGM-84D、UGM-84Dは目標の大きさに応じてポップアップ・モードが変化する。小型艇や浮上中の潜水艦にはポップアップ飛翔で、通常の水上艦にはシースキミング飛翔で攻撃する。
Tip019=軍艦が搭載する低出力の対水上捜索レーダーの多くは民間船の航海レーダーと見分けがつかず、ESMで容易に識別できない。一方、対空捜索能力を持つ高出力の対水上捜索レーダーは特徴が明確であり、使用すると自艦の正体を明かすことになる。
