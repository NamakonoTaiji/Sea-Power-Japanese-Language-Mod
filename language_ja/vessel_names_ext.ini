[rn_ssn_churchill]
Type=SSN,攻撃型原子力潜水艦
Default=チャーチル級,Churchill
DefaultDescription=チャーチル級は1970年以降に就役したイギリスの攻撃型原子力潜水艦で、全3隻が建造された。先行するヴァリアント級と設計が似ているため、同級の改良型ともみなされる。ヴァリアント級より静粛性とソナー性能が向上し、機関配置も改良された。
Variant1=S46 チャーチル,Churchill
Variant2=S48 コンカラー,Conqueror
Variant3=S50 カレイジャス,Courageous

[rn_ssn_churchill_late]
Type=SSN,攻撃型原子力潜水艦
Default=チャーチル級(後期型),Churchill
DefaultDescription=チャーチル級は1970年以降に就役したイギリスの攻撃型原子力潜水艦で、全3隻が建造された。先行するヴァリアント級と設計が似ているため、同級の改良型ともみなされる。ヴァリアント級より静粛性とソナー性能が向上し、機関配置も改良された。1980年代にはUGM-84ハープーン、タイガーフィッシュ魚雷、曳航ソナー、画期的なポンプジェット推進装置を導入する改修が施された。
Variant1=S46 チャーチル,Churchill
Variant2=S48 コンカラー,Conqueror
Variant3=S50 カレイジャス,Courageous

