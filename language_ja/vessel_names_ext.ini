[rn_lpd_fearless]
Type=LPD,揚陸艦
Default=フィアレス級,Fearless
DefaultDescription=フィアレス級の2隻は専用設計のドック型輸送揚陸艦（LPD）であり、大型の注水可能なウェルドックに、広い飛行甲板と指揮統制設備を組み合わせている。搭載する上陸用舟艇（LCU）で車両を陸上へ輸送する。一般的な強襲揚陸艦（LHA）より多くの車両を運べるが、航空機の搭載数は大幅に少ない。
Variant1=フィアレス L10,Fearless
Variant2=イントレピッド L11,Intrepid

