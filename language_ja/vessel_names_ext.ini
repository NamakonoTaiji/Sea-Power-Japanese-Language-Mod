[rn_ss_oberon]
Type=SS,哨戒潜水艦
Default=オベロン級,Oberon
DefaultDescription=オベロン級は、船体材料の強化と装備の改良を施したポーパス級の後継として英国で開発された、全27隻のディーゼル電気推進の攻撃・哨戒潜水艦である。優れた静粛性で知られ、冷戦期には監視、敵艦艇や潜水艦の追跡、特殊部隊の潜入と回収、対潜戦訓練などに従事した。イギリス海軍とオーストラリア海軍を含む5カ国の海軍で運用され、2000年まで現役にとどまった。
