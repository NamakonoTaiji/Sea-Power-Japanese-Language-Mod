[ara_cl_belgrano]
Type=CL,軽巡洋艦
Default=ブルックリン級,Brooklyn
DefaultDescription=ブルックリン級軽巡洋艦は1930年代に米海軍向けに建造され、第二次世界大戦を通じて大西洋と太平洋で活躍した。戦後、米国は相互防衛援助計画の一環として本級の大半を南米諸国の海軍に売却した。各艦は戦時中の構成のまま引き渡され、アルゼンチン、チリ、ブラジルでの運用中にセンサーの更新や、ときには新兵装の搭載が行われた。本級は15門の6インチ47口径速射砲を備え、その高い発射速度から、ソロモン諸島での夜戦を目撃した日本側は「機関銃巡洋艦」と呼んだ。
Variant1=ヘネラル・ベルグラノ C-4,Belgrano
Variant2=ヌエベ・デ・フリオ C-5, 9 de Julio
Variant3=オイギンス CL-02,O'Higgins
Variant4=カピタン・プラット CL-03,Prat
Variant5=バローゾ C-11,Barroso

