[rn_ssn_valiant]
Type=SSN,攻撃型原子力潜水艦
Default=ヴァリアント級,Valiant
DefaultDescription=ヴァリアント級は1960年代に建造されたイギリスの攻撃型原子力潜水艦で、全2隻からなる。英国初の原子力潜水艦HMSドレッドノートを大幅に改良した発展型である。機械類を浮き台に載せて振動を抑えるラフティングなど、当時としては革新的な技術を採用し、同時代の潜水艦としては高い静粛性を実現した。運用後期にはUGM-84ハープーンとタイガーフィッシュ魚雷を搭載できるよう改修された。
Variant1=S102 ヴァリアント,Valiant
Variant2=S103 ウォースパイト,Warspite

