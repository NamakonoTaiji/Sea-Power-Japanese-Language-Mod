[LoadoutNames]
#------------------------------------------ 新システム ------------------------------------------
# - LongRangeは兵装の射程ではなく、機体の航続距離を指す
# ---------- 必須兵装 ----------
Default=標準                            // 通常、その機体で最も一般的な兵装
Ferry=回航                              // 増槽を最大数装備し、機関砲とチャフ以外の武装は搭載しない
Empty=非武装                            // 増槽も武装も搭載しない（機関砲とチャフを除く）

# ---------- 対空兵装 ----------
AirToAir=空対空（標準）                  // 当該機種の標準的な空対空兵装
AirToAirLongRange=空対空（長距離航続）   // 武装を減らし、燃料を増やした空対空兵装
AirToAirIntercept=空対空（迎撃）         // 中・短距離空対空ミサイルを重視した迎撃兵装

# ---------- 対地兵装 ----------
Strike=爆装（標準）                      // 無誘導爆弾を1回の斉射分搭載
StrikeLongRange=爆装（長距離航続）       // 標準爆装より武装を減らし、燃料を増やした構成
StrikePrecision=爆装（精密攻撃）         // 誘導爆弾またはAS-7などの対地ミサイル
StrikeHeavy=爆装（重爆撃）               // 重爆撃機向けの攻撃兵装（AIの運用区分にも使用）
StrikeDemo=爆装（施設破壊）              // バンカーや橋梁などの堅固な点目標を破壊する、1300kg超の超重量級爆弾を用いた特殊兵装
StrikeLowAlt=爆装（低空攻撃）            // スネークアイやパラシュート爆弾などの高抵抗爆弾を用いる低高度攻撃兵装

CAS=近接航空支援                         // ロケット弾、クラスター爆弾、通常爆弾を小規模な斉射に分け、攻撃回数を増やす構成
CASLight=近接航空支援（軽装）            // 搭載量よりも航続時間を重視した近接航空支援兵装
AntiArmor=対装甲                         // 主に戦車などの地上車両へ有効な対地ミサイル兵装

LandAttack=長距離対地攻撃                // AGM-86CやRGM-109Cなど、長距離対地巡航ミサイルを搭載する構成

# ---------- 対艦兵装 ----------
AntiShip=対艦（標準）                    // 無誘導爆弾から中距離対艦ミサイルまでを含む汎用的な対艦兵装
AntiShipLongRange=対艦（長距離航続）     // 標準対艦兵装に増槽を追加した構成
AntiShipPrecision=対艦（精密攻撃）       // 誘導爆弾やミサイルを用いる精密対艦兵装
AntiShipHeavy=対艦（重装）               // Tu-22やTu-16などの大型対艦爆撃機、または最大兵装を搭載する小型機向け

# ---------- 対潜兵装 ----------
ASW=対潜（多用途）                       // 魚雷、爆雷、ソノブイを搭載する多用途対潜兵装
ASWHunter=対潜捜索                       // ソノブイのみを搭載し、攻撃兵器は持たない
ASWHunterLight=対潜捜索（軽装）          // 少数のソノブイのみを搭載し、攻撃兵器は持たない
ASWKiller=対潜攻撃                       // 対潜攻撃兵器のみを搭載
ASWBomb=対潜（爆雷）                     // 爆雷を用いる対潜兵装
ASWLongRange=対潜（長距離航続）          // 魚雷と増槽を搭載

# ---------- 特殊兵装 ----------
SEAD=SEAD（敵防空網制圧）                 // 対レーダーミサイルやクラスター爆弾を搭載
SEADLongRange=SEAD（長距離航続）          // 標準SEAD兵装より武装を減らし、燃料を増やした構成
SEADAdvanced=SEAD（先進兵装）             // HARM、STARM、AS-11など、管理対象・供給数限定・時期制限のある兵器を使用

AEW=早期警戒                              // 機体用途を示す呼称。兵装自体は「非武装」と同等
Recon=偵察                                // 機体用途を示す。偵察ポッドを搭載する場合がある
EW=電子戦                                 // 機体用途を示す。電子戦ポッドを搭載する場合がある
Transport=輸送                            // 輸送任務用

Tanker=空中給油                            // 他機への空中給油を可能にする装備

Gun=機関砲のみ                           // 機関砲弾のみを搭載

# ---------- 貨物搭載 ----------
Containers=コンテナ貨物
Munitions=弾薬
MilitaryVehicles=軍用車両
DryCargo=乾貨物
Vehicles=車両
Fertilizer=肥料
Lighters=はしけ
Oil=石油
Ore=鉱石
Passengers=旅客
Troops=兵員

# ---------- 汎用ユニット装備オプション ----------
Early=初期型
Late=後期型
Kiev=キエフ級レーダー・デコイ
Kirov=キーロフ級レーダー・デコイ
Udaloy=ウダロイ級レーダー・デコイ
Sovremenny=ソヴレメンヌイ級レーダー・デコイ
Sverdlov=スヴェルドロフ級レーダー・デコイ
Kynda=キンダ級レーダー・デコイ
KrestaI=クレスタI級レーダー・デコイ
KrestaII=クレスタII級レーダー・デコイ
Kara=カーラ級レーダー・デコイ
Petya=ペチャ級レーダー・デコイ
KrivakI=クリヴァクI級レーダー・デコイ
KrivakII=クリヴァクII級レーダー・デコイ
