[LoadScreen]
WarningPSE=特定の光のパターンや点滅にさらされると、ごく稀に、てんかん発作を起こすことがあります。コンピュータ画面上の特定のパターンや背景、またはビデオゲームのプレイ中に、これらの症状が誘発される場合があります。また、これまでに発作やてんかんの既往歴がない方でも、特定の条件下で未診断の症状が現れることがあります。\r\n\r\nご自身やご家族にてんかんの既往がある場合は、プレイ前に医師にご相談ください。ビデオゲームやコンピュータゲームのプレイ中に、めまい、視覚の異常、目や筋肉の痙攣、意識の喪失、失見当識、不随意運動、またはひきつけなどの症状を感じた場合は、直ちにプレイを中止し、再開前に医師の診察を受けてください。
WarningValidity=ゲームファイルの内容が想定されるハッシュ値と一致しません。ゲームを終了し、/StreamingAssets/original フォルダの内容を削除した後、Steamでファイルの整合性を確認してください。\r\n\r\n「フォルダ削除」を押すと自動的に削除され、次回の起動時にSteamによって再ダウンロードされます。
