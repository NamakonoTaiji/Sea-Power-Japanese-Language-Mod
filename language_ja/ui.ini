Doctrine=行動基準を切り替える
DoctrineTransitTelegraph=このプラットフォーム種別が移動時に使用する既定の速力段階を設定します。
DoctrineLoiterTelegraph=このプラットフォーム種別が待機時に使用する既定の速力段階を設定します。
DoctrineAllowAlignment=有効にすると、兵器を指向させるためユニットが針路を変更できます。
DoctrineAircraftWinchesterRtb=有効にすると、プレイヤー航空機はウィンチェスターと判断された時点で基地へ帰還します。
DoctrineInterceptorAllAamRtb=有効にすると、戦闘機は短距離ミサイルを含む全空対空ミサイルを使い切るまで任務を継続します。
DoctrineFighterAllAamAndGunRtb=有効にすると、戦闘機は全空対空ミサイルと機関砲弾を使い切るまで任務を継続します。
DoctrineFighterRtbCondition=全空対空ミサイルを使い切った時点をウィンチェスターとするか、空対空ミサイルと機関砲弾の両方を使い切った時点とするかを選択します。
DoctrineHelicopterSonobuoyDeployState=プレイヤーのヘリコプターが投下するソノブイの既定捜索深度を設定します。「交互」では変温層の上下へ交互に投下します。
DoctrineAASalvoSize=自動対空交戦時、プレイヤー艦が接近する航空脅威1目標あたりに発射する迎撃弾数を設定します。
DoctrineShipsOnWeaponsTightEngageHostileAircraft=有効にすると、「自衛のみ」のプレイヤー艦が探知済みの敵航空機と自動交戦できます。警告：航空機との交戦により艦のレーダーが作動する場合があります。
DoctrineShipsAutoUseSAMsAgainstSurfaceTargets=有効にすると、プレイヤー艦が対水上モードを持つ艦対空ミサイルを水上目標へ自動使用できます。
DoctrineShipsAutoUseAntiShipMissilesAgainstSurfaceTargets=無効にすると、「武器使用自由」のプレイヤー艦は水上目標への対艦ミサイル自動交戦を新たに開始しません。砲、魚雷、ASROC、使用可能な対水上対応SAMは引き続き使用されます。手動攻撃命令と発射済み斉射には影響しません。
DoctrineBombAttackProfile=プレイヤー航空機の爆撃方法を選択します。「自動」は兵装と高度に応じた動作を維持し、「ポップアップ」は攻撃前に上昇、「水平爆撃」は水平飛行を維持、「急降下爆撃」は目標へ直接降下します。
DoctrineFightersDoNotEngageAntiShipMissiles=有効にすると、プレイヤー戦闘機は探知済みの対艦ミサイルと自動交戦しません。
DoctrineAutoAttackSurface=有効にすると、「武器使用自由」のプレイヤーユニットが有効な敵水上目標と自動交戦できます。
DoctrineCollisionAvoidance=有効にすると、艦艇と潜水艦が周辺交通を避けるため自動衝突回避機動を行います。
DoctrineDropTanks=有効にすると、プレイヤー航空機は戦闘開始時に増槽を自動投棄します。
DoctrineFormationSprintAndDrift=選択中の編隊に属する対象艦艇・潜水艦すべてへスプリント＆ドリフト航法を適用します。
DoctrineUnitSprintAndDrift=選択中の艦艇または潜水艦に、通常のウェイポイントをたどりながら高速航走と低速聴音を交互に行わせます。
DoctrineFormationBafflesClearing=選択中の編隊の潜水艦が、ウェイポイントへの移動中に定期的な旋回と聴音を行い、ソナーの後方死角を確認できるようにします。
DoctrineUnitBafflesClearing=選択中の潜水艦が、ウェイポイントへの移動中に定期的な旋回と聴音を行い、ソナーの後方死角を確認できるようにします。
DoctrineRemoveEngageTaskAfter=未受理の交戦タスクを、この秒数が経過した後に保留タスクリストから削除します。
DoctrineBombersStaysWithAAM=有効にすると、空対空ミサイルを搭載した爆撃機は全弾を使用するまで任務を継続します。
DoctrineASWBombersStaysWithSonobuoys=有効にすると、ソノブイを搭載した対潜哨戒機はすべて使用するまで任務を継続します。
DoctrineFighterBombersStaysWithAAM=有効にすると、空対空ミサイルを搭載した戦闘爆撃機は全弾を使用するまで任務を継続します。
DoctrineSRFightersStaysWithGuns=有効にすると、短距離戦闘機と戦闘爆撃機は機関砲弾が残っている間、任務を継続します。
DoctrineOverride=設定すると、継承値をこの階層の設定で上書きします。
