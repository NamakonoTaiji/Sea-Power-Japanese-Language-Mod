[rn_frs1]
Type=Fighter,戦闘機
Default=シーハリアー FRS.1,FRS.1
DefaultDescription=シーハリアーFRS.1は、ハリアーGR.1をイギリス海軍向けに改良した艦上機である。空対空能力が強化され、ブルーフォックス・レーダーで空中や海上の目標を探知できる。英国キングストンの工場ではハリアーGR.1やGR.3と同じ生産ラインで製造され、同工場にとって輸出面でも大きな成功を収めた。本機は、欧州の3カ国共同評価飛行隊で運用されたケストレルとP.1127の発展型である。
Squadron1=シーハリアー FRS.1 第800海軍航空隊,FRS.1
Squadron2=シーハリアー FRS.1 第801海軍航空隊,FRS.1
Squadron3=シーハリアー FRS.1 第809海軍航空隊,FRS.1
Squadron4=シーハリアー FRS.1 第899海軍航空隊,FRS.1
Callsigns=Squadron1,Blue|Squadron2,Black|Squadron3,Red|Squadron4,Yellow

[rn_nimrod_mr1]
Type=Maritime Patrol,哨戒機
Default=ニムロッド MR.1,MR1
DefaultDescription=ニムロッドMR.1は、デ・ハビランド・コメット旅客機を基に開発された、イギリス空軍初のジェット式海上哨戒機である。1960年代後半に就役し、長い航続距離と水上捜索レーダー、ソノブイ、魚雷を生かして対潜戦と海上監視に従事した。改良型MR.2に交代するまで、英国の海上哨戒戦力の主力を担った。
Squadron1=ニムロッド MR.1,MR1

