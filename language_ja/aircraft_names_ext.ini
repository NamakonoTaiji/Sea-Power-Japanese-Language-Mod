[usaf_ef-111a]
Type=EW Aircraft,電子戦機
Default=EF-111A レイヴン,EF-111FA
DefaultDescription=EF-111Aは米空軍が運用する電子戦機である。F-111を基に開発され、AIM-9ミサイル以外の武装は持たず、速度と加速力を主な防御手段とする。強力なAN/ALQ-99E妨害ポッドを搭載しており、これは艦上機EA-6Bが使用する米海軍のAN/ALQ-99妨害システムから発展したものである。EF-111Aは米空軍に、超音速で敵空域へ侵入して電子戦を行う能力をもたらした。通常は阻止攻撃任務でF-111攻撃機と連携する。

# 20th TFW - RAF Upper Heyford, England
Squadron1=EF-111A 第42電子戦飛行隊,EF-111A

