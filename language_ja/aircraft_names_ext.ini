[rn_lynx_has2]
Type=ASW Helicopter,対潜ヘリコプター
Default=リンクス HAS.2,Lynx HAS.2
DefaultDescription=リンクスは当初、イギリス陸軍の汎用ヘリコプターとして開発された。完全リジッド式ローターヘッドを採用し、複雑な曲技飛行が可能な世界最速のヘリコプターである。イギリス海軍向けのHAS.2型は、甲板上での取り回しのため主脚がそれぞれ回転する車輪式降着装置と水上捜索レーダーを備え、軽対水上戦（ASuW）兵器と対潜戦（ASW）兵器を搭載できる。
