[usaf_f-111f]
Type=Attack,攻撃機
Default=F-111F アードバーク,F-111F
DefaultDescription=F-111はアメリカ製の超音速中距離戦闘爆撃機である。1967年に導入され、攻撃、戦略爆撃（核・通常兵器）、偵察、電子戦などの任務に就いた。米軍の量産機として初めて可変後退翼とアフターバーナー付きターボファンエンジンを採用した。F-111Fは1970年代に製造された最終派生型で、電子装備が更新され、より強力なエンジンを搭載している。

# 366th TFW - Mountain Home AFB, Idaho, US
